<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Leaderboard - Survive the Bots</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #172554,
                    #020617 70%
                );

            color: white;

            font-family: Arial, sans-serif;
        }


        /* ====================================================
           HEADER
        ==================================================== */

        header {

            padding: 18px;

            background: #020617;

            border-bottom:
                1px solid #334155;

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        header h1 {

            margin: 0;

            margin-right: auto;

            color: #38bdf8;

            font-size: 24px;
        }


        button {

            padding: 10px 14px;

            border: 0;

            border-radius: 8px;

            background: #0284c7;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #0369a1;
        }


        .logout {

            background: #dc2626;
        }


        .logout:hover {

            background: #b91c1c;
        }


        /* ====================================================
           CONTAINER
        ==================================================== */

        .container {

            width: min(900px, 92%);

            margin: 30px auto;
        }


        .card {

            background:
                rgba(15, 23, 42, .96);

            border:
                1px solid #334155;

            border-radius: 16px;

            padding: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, .25);
        }


        /* ====================================================
           MESSAGE
        ==================================================== */

        .message {

            padding: 13px;

            margin-bottom: 15px;

            border-radius: 9px;

            background: #1e293b;

            color: #cbd5e1;

            display: none;
        }


        .message.show {

            display: block;
        }


        .message.error {

            background: #451a1a;

            color: #fecaca;
        }


        /* ====================================================
           TABLE
        ==================================================== */

        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 550px;
        }


        th,
        td {

            padding: 13px 10px;

            border-bottom:
                1px solid #334155;

            text-align: left;
        }


        th {

            color: #38bdf8;

            font-size: 14px;
        }


        tbody tr:hover {

            background:
                rgba(30, 41, 59, .6);
        }


        .rank {

            width: 60px;

            font-weight: bold;

            color: #facc15;
        }


        .player-name {

            font-weight: bold;
        }


        .score {

            color: #facc15;

            font-weight: bold;
        }


        .empty {

            text-align: center;

            color: #94a3b8;

            padding: 30px;
        }


        /* ====================================================
           TOP 3
        ==================================================== */

        .rank-1 {

            color: #facc15;
        }


        .rank-2 {

            color: #cbd5e1;
        }


        .rank-3 {

            color: #d97706;
        }


        /* ====================================================
           VERSION
        ==================================================== */

        .version {

            position: fixed;

            right: 12px;

            bottom: 8px;

            color: #64748b;

            font-size: 11px;
        }


        /* ====================================================
           MOBILE
        ==================================================== */

        @media (max-width: 650px) {

            header {

                padding: 14px;
            }


            header h1 {

                width: 100%;

                margin-right: 0;

                margin-bottom: 5px;
            }


            header button {

                flex: 1;

                font-size: 12px;

                padding: 9px 7px;
            }


            .container {

                width: 94%;

                margin-top: 20px;
            }


            .card {

                padding: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ====================================================
         HEADER
    ==================================================== -->

    <header>

        <h1>
            🏆 Leaderboard
        </h1>


        <button
            type="button"
            onclick="goTo('game.html')">

            🎮 Game

        </button>


        <button
            type="button"
            onclick="goTo('shop.html')">

            🛒 Shop

        </button>


        <button
            type="button"
            onclick="goTo('inventory.html')">

            🔫 Wapens

        </button>


        <button
            type="button"
            class="logout"
            onclick="logout()">

            Uitloggen

        </button>

    </header>


    <!-- ====================================================
         CONTENT
    ==================================================== -->

    <div class="container">

        <div
            id="message"
            class="message">
        </div>


        <div class="card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Speler
                            </th>

                            <th>
                                Score
                            </th>

                            <th>
                                Kills
                            </th>

                            <th>
                                Wave
                            </th>

                        </tr>

                    </thead>


                    <tbody id="leaderboard">

                        <tr>

                            <td
                                colspan="5"
                                class="empty">

                                Leaderboard laden...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div class="version">
        Survive the Bots v1.3.2
    </div>


    <!-- ====================================================
         SUPABASE
    ==================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="auth.js"></script>


    <script>

        "use strict";


        /* ==================================================
           SUPABASE CLIENT
        ================================================== */

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==================================================
           MESSAGE
        ================================================== */

        function showMessage(
            text,
            error = false
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent = text;

            message.className =
                "message show";


            if (error) {

                message.classList.add(
                    "error"
                );

            }

        }


        /* ==================================================
           NAVIGATION
        ================================================== */

        function goTo(page) {

            /*
                We gebruiken bewust geen
                Supabase Auth check hier.

                De rest van het project gebruikt
                stb_player in localStorage.
            */

            const player =
                getCurrentPlayer();


            if (!player) {

                window.location.href =
                    "index.html";

                return;
            }


            window.location.href =
                page;

        }


        /* ==================================================
           LOAD LEADERBOARD
        ================================================== */

        async function loadLeaderboard() {

            const body =
                document.getElementById(
                    "leaderboard"
                );


            body.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty">
                        Leaderboard laden...
                    </td>
                </tr>
            `;


            try {

                /*
                    We lezen rechtstreeks uit de
                    leaderboard-view.

                    Dit past bij je bestaande database.
                */

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("leaderboard")
                        .select(
                            "player_name,score,kills,wave"
                        )
                        .order(
                            "score",
                            {
                                ascending: false
                            }
                        )
                        .limit(100);


                if (error) {

                    console.error(
                        "Leaderboard error:",
                        error
                    );


                    body.innerHTML = `
                        <tr>
                            <td
                                colspan="5"
                                class="empty">

                                Leaderboard kon niet geladen worden.

                            </td>
                        </tr>
                    `;


                    showMessage(
                        error.message,
                        true
                    );

                    return;
                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    body.innerHTML = `
                        <tr>
                            <td
                                colspan="5"
                                class="empty">

                                Er zijn nog geen scores.

                            </td>
                        </tr>
                    `;

                    return;
                }


                body.innerHTML = "";


                data.forEach(
                    (row, index) => {

                        const tr =
                            document.createElement(
                                "tr"
                            );


                        const rank =
                            index + 1;


                        let rankClass =
                            "rank";


                        if (rank === 1) {
                            rankClass =
                                "rank rank-1";
                        }

                        if (rank === 2) {
                            rankClass =
                                "rank rank-2";
                        }

                        if (rank === 3) {
                            rankClass =
                                "rank rank-3";
                        }


                        const playerName =
                            escapeHtml(
                                row.player_name
                            );


                        const score =
                            Number(
                                row.score || 0
                            );


                        const kills =
                            Number(
                                row.kills || 0
                            );


                        const wave =
                            Number(
                                row.wave || 0
                            );


                        tr.innerHTML = `

                            <td class="${rankClass}">
                                ${getMedal(rank)}
                                ${rank}
                            </td>

                            <td class="player-name">
                                ${playerName}
                            </td>

                            <td class="score">
                                ${score}
                            </td>

                            <td>
                                ${kills}
                            </td>

                            <td>
                                ${wave}
                            </td>

                        `;


                        body.appendChild(tr);

                    }
                );


            } catch (error) {

                console.error(
                    "Leaderboard exception:",
                    error
                );


                body.innerHTML = `
                    <tr>
                        <td
                            colspan="5"
                            class="empty">

                            Er ging iets mis bij het laden.

                        </td>
                    </tr>
                `;


                showMessage(
                    "Er ging iets mis bij het laden van het leaderboard.",
                    true
                );

            }

        }


        /* ==================================================
           MEDALS
        ================================================== */

        function getMedal(rank) {

            if (rank === 1) {
                return "🥇";
            }

            if (rank === 2) {
                return "🥈";
            }

            if (rank === 3) {
                return "🥉";
            }

            return "";

        }


        /* ==================================================
           ESCAPE HTML
        ================================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* ==================================================
           LOGOUT
        ================================================== */

        function logout() {

            if (
                typeof window.logout ===
                "function"
            ) {

                window.logout();

                return;
            }


            localStorage.removeItem(
                "stb_player"
            );


            window.location.href =
                "index.html";

        }


        /* ==================================================
           INIT
        ================================================== */

        function init() {

            const player =
                getCurrentPlayer();


            if (!player) {

                window.location.href =
                    "index.html";

                return;
            }


            loadLeaderboard();

        }


        /* ==================================================
           GLOBAL FUNCTIONS
        ================================================== */

        window.loadLeaderboard =
            loadLeaderboard;

        window.goTo =
            goTo;

        window.logout =
            logout;


        /* ==================================================
           START
        ================================================== */

        init();

    </script>

</body>

</html>
