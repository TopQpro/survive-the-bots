<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Mijn wapens - Survive the Bots</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #172554 0%,
            #020617 65%
        );

    color: white;

    font-family: Arial, sans-serif;
}


/* ============================================================
   HEADER
============================================================ */

header {

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 14px 18px;

    background:
        rgba(2, 6, 23, .97);

    border-bottom:
        1px solid #334155;

    box-shadow:
        0 5px 25px rgba(0,0,0,.25);
}


header h1 {

    margin: 0;

    margin-right: auto;

    color: #38bdf8;

    font-size: 21px;
}


button {

    padding: 10px 14px;

    border: 0;

    border-radius: 8px;

    background: #0284c7;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .15s,
        transform .1s;
}


button:hover {

    background: #0369a1;

    transform: translateY(-1px);
}


.logout {

    background: #dc2626;
}


.logout:hover {

    background: #b91c1c;
}


/* ============================================================
   CONTAINER
============================================================ */

.container {

    width: min(1050px, 92%);

    margin: 30px auto;

    padding-bottom: 40px;
}


/* ============================================================
   INTRO
============================================================ */

.intro {

    margin-bottom: 20px;
}


.intro h2 {

    margin-bottom: 5px;

    color: #e2e8f0;
}


.intro p {

    margin-top: 0;

    color: #94a3b8;
}


/* ============================================================
   MESSAGE
============================================================ */

.message {

    padding: 15px;

    margin-bottom: 20px;

    background:
        rgba(15,23,42,.96);

    border:
        1px solid #334155;

    border-radius: 12px;

    color: #cbd5e1;
}


.message.error {

    border-color: #7f1d1d;

    background:
        rgba(69,26,26,.8);

    color: #fecaca;
}


.hidden {

    display: none !important;
}


/* ============================================================
   WEAPONS GRID
============================================================ */

.weapons {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px, 1fr)
        );

    gap: 18px;
}


/* ============================================================
   WEAPON CARD
============================================================ */

.card {

    overflow: hidden;

    background:
        rgba(15,23,42,.96);

    border:
        1px solid #334155;

    border-radius: 16px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);

    transition:
        transform .15s,
        border-color .15s,
        box-shadow .15s;
}


.card:hover {

    transform: translateY(-3px);

    border-color: #38bdf8;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.4);
}


/* ============================================================
   IMAGE / ICON
============================================================ */

.weapon-visual {

    height: 150px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle,
            #1e293b,
            #020617
        );

    border-bottom:
        1px solid #334155;
}


.weapon-image {

    width: 100%;

    height: 150px;

    object-fit: contain;
}


.weapon-icon {

    font-size: 70px;
}


/* ============================================================
   CARD CONTENT
============================================================ */

.card-content {

    padding: 18px;
}


.card h2 {

    margin-top: 0;

    margin-bottom: 8px;

    color: #38bdf8;
}


.description {

    min-height: 42px;

    color: #cbd5e1;

    line-height: 1.5;
}


/* ============================================================
   STATS
============================================================ */

.stats {

    margin-top: 15px;

    padding-top: 12px;

    border-top:
        1px solid #334155;

    color: #cbd5e1;

    line-height: 1.8;
}


.stat-label {

    color: #64748b;
}


/* ============================================================
   SOURCE
============================================================ */

.source {

    display: inline-block;

    margin-top: 15px;

    padding: 5px 8px;

    border-radius: 6px;

    background: #1e293b;

    color: #94a3b8;

    font-size: 12px;
}


/* ============================================================
   VERSION
============================================================ */

.version {

    position: fixed;

    right: 10px;

    bottom: 7px;

    color: #475569;

    font-size: 11px;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {

    header {

        flex-wrap: wrap;

    }

    header h1 {

        width: 100%;

        margin-right: 0;

        margin-bottom: 5px;

    }

    header button {

        font-size: 12px;

        padding: 8px 10px;

    }

}


@media (max-width: 450px) {

    .weapons {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header>

    <h1>
        🔫 Mijn wapens
    </h1>


    <button
        type="button"
        onclick="goTo('game.html')">

        🎮 Game

    </button>


    <button
        type="button"
        onclick="goTo('shop.html')">

        🛒 Shop

    </button>


    <button
        type="button"
        onclick="goTo('leaderboard.html')">

        🏆 Scores

    </button>


    <button
        id="adminButton"
        class="hidden"
        type="button"
        onclick="goTo('admin.html')">

        👑 Admin

    </button>


    <button
        class="logout"
        type="button"
        onclick="logout()">

        Uitloggen

    </button>

</header>


<!-- ==========================================================
     CONTENT
========================================================== -->

<main class="container">


    <div class="intro">

        <h2>
            Jouw arsenaal
        </h2>

        <p>
            Bekijk hier alle wapens die je momenteel bezit.
        </p>

    </div>


    <div
        id="message"
        class="message">

        Wapens laden...

    </div>


    <div
        id="weapons"
        class="weapons">

    </div>


</main>


<div class="version">
    Survive the Bots v1.3.2
</div>


<!-- ==========================================================
     SCRIPTS
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="auth.js"></script>


<script>

"use strict";


// ============================================================
// SUPABASE
// ============================================================

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ============================================================
// PLAYER
// ============================================================

let currentPlayer = null;


// ============================================================
// NAVIGATION
// ============================================================

function goTo(page) {

    window.location.href = page;
}


// ============================================================
// INIT
// ============================================================

async function init() {

    currentPlayer =
        requireLogin();

    if (!currentPlayer) {
        return;
    }


    if (
        currentPlayer.role === "admin"
    ) {

        document
            .getElementById("adminButton")
            .classList.remove("hidden");

    }


    await giveDefaultWeapons();

    await loadWeapons();

}


// ============================================================
// DEFAULT WAPENS
// ============================================================

async function giveDefaultWeapons() {

    try {

        const { error } =
            await supabaseClient.rpc(
                "give_default_weapons",
                {
                    p_user_id:
                        currentPlayer.id
                }
            );


        if (error) {

            console.error(
                "Default wapens:",
                error
            );

        }

    } catch (error) {

        console.error(
            "Default wapens:",
            error
        );

    }

}


// ============================================================
// LOAD WEAPONS
// ============================================================

async function loadWeapons() {

    const container =
        document.getElementById(
            "weapons"
        );

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "Wapens laden...";

    message.className =
        "message";


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "get_my_weapons"
            );


        if (error) {

            console.error(
                "Wapens laden:",
                error
            );

            message.textContent =
                "Wapens konden niet geladen worden.";

            message.classList.add(
                "error"
            );

            return;
        }


        container.innerHTML = "";


        if (
            !data ||
            data.length === 0
        ) {

            message.textContent =
                "Je hebt nog geen wapens.";

            return;
        }


        message.classList.add(
            "hidden"
        );


        data.forEach(
            weapon => {

                container.appendChild(
                    createWeaponCard(
                        weapon
                    )
                );

            }
        );


    } catch (error) {

        console.error(
            "Wapens laden:",
            error
        );

        message.textContent =
            "Er ging iets mis bij het laden van de wapens.";

        message.classList.add(
            "error"
        );

    }

}


// ============================================================
// CREATE WEAPON CARD
// ============================================================

function createWeaponCard(
    weapon
) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "card";


    // --------------------------------------------------------
    // VISUAL
    // --------------------------------------------------------

    const visual =
        document.createElement(
            "div"
        );

    visual.className =
        "weapon-visual";


    if (weapon.image_url) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "weapon-image";

        image.src =
            weapon.image_url;

        image.alt =
            weapon.name || "Wapen";

        image.onerror =
            function () {

                visual.innerHTML = "";

                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "weapon-icon";

                icon.textContent =
                    weapon.icon || "🔫";

                visual.appendChild(
                    icon
                );

            };


        visual.appendChild(
            image
        );

    } else {

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "weapon-icon";

        icon.textContent =
            weapon.icon || "🔫";

        visual.appendChild(
            icon
        );

    }


    card.appendChild(
        visual
    );


    // --------------------------------------------------------
    // CONTENT
    // --------------------------------------------------------

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "card-content";


    const title =
        document.createElement(
            "h2"
        );

    title.textContent =
        weapon.name || "Onbekend wapen";

    content.appendChild(
        title
    );


    const description =
        document.createElement(
            "div"
        );

    description.className =
        "description";

    description.textContent =
        weapon.description ||
        "Geen beschrijving beschikbaar.";

    content.appendChild(
        description
    );


    // --------------------------------------------------------
    // STATS
    // --------------------------------------------------------

    const stats =
        document.createElement(
            "div"
        );

    stats.className =
        "stats";


    stats.innerHTML = `

        <div>
            <span class="stat-label">💥 Damage:</span>
            ${escapeHtml(weapon.damage)}
        </div>

        <div>
            <span class="stat-label">⚡ Fire rate:</span>
            ${escapeHtml(weapon.fire_rate)} ms
        </div>

        <div>
            <span class="stat-label">🔫 Kogels:</span>
            ${escapeHtml(weapon.bullets)}
        </div>

        <div>
            <span class="stat-label">🎯 Snelheid:</span>
            ${escapeHtml(weapon.bullet_speed)}
        </div>

    `;


    content.appendChild(
        stats
    );


    // --------------------------------------------------------
    // SOURCE
    // --------------------------------------------------------

    const source =
        document.createElement(
            "div"
        );

    source.className =
        "source";

    source.textContent =
        "Verkregen via: " +
        (
            weapon.source ||
            "onbekend"
        );


    content.appendChild(
        source
    );


    card.appendChild(
        content
    );


    return card;

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ============================================================
// START
// ============================================================

init();

</script>

</body>

</html>
