<!DOCTYPE html> <html lang="nl"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Leaderboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {

        margin: 0;
        min-height: 100vh;

        background:
            radial-gradient(
                circle at top,
                #172554,
                #020617 65%
            );

        color: white;

        font-family:
            Arial,
            sans-serif;
    }


    header {

        padding: 18px;

        background: #020617;

        border-bottom:
            1px solid #334155;

        display: flex;

        align-items: center;

        gap: 10px;

        flex-wrap: wrap;
    }


    header h1 {

        margin:
            0
            auto
            0
            0;

        color: #38bdf8;
    }


    button {

        padding:
            10px
            14px;

        border: 0;

        border-radius: 8px;

        background: #0284c7;

        color: white;

        font-weight: bold;

        cursor: pointer;
    }


    button:hover {

        background: #0369a1;
    }


    .container {

        width:
            min(
                900px,
                92%
            );

        margin:
            30px
            auto;
    }


    .card {

        background:
            rgba(
                15,
                23,
                42,
                .96
            );

        border:
            1px solid #334155;

        border-radius: 15px;

        padding: 20px;

        overflow-x: auto;
    }


    table {

        width: 100%;

        border-collapse:
            collapse;
    }


    th,
    td {

        padding: 12px;

        border-bottom:
            1px solid #334155;

        text-align: left;
    }


    th {

        color: #38bdf8;
    }


    .rank {

        font-weight: bold;

        color: #facc15;
    }


    .empty {

        text-align: center;

        color: #94a3b8;

        padding: 30px;
    }


    .error {

        color: #f87171;

        padding: 20px;

        text-align: center;
    }

</style>

</head> <body> <header>
<h1>
    🏆 Leaderboard
</h1>


<button
    onclick="location.href='game.html'"
>
    🎮 Game
</button>


<button
    onclick="location.href='shop.html'"
>
    🛒 Shop
</button>


<button
    onclick="location.href='inventory.html'"
>
    🔫 Wapens
</button>


<button
    onclick="location.href='index.html'"
>
    ← Menu
</button>

</header> <div class="container">
<div class="card">

    <table>

        <thead>

            <tr>

                <th>#</th>

                <th>Speler</th>

                <th>Score</th>

                <th>Kills</th>

                <th>Wave</th>

            </tr>

        </thead>


        <tbody id="leaderboard">

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    Leaderboard laden...
                </td>

            </tr>

        </tbody>

    </table>

</div>

</div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="supabase-config.js"></script> <script> "use strict"; const supabaseClient = supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); async function init() { /* * Onze game gebruikt public.players * en localStorage voor de login. * * Daarom controleren we hier NIET * op Supabase Auth. */ const saved = localStorage.getItem( "stb_player" ); if (!saved) { location.href = "index.html"; return; } try { const player = JSON.parse(saved); if ( !player || !player.id ) { throw new Error( "Ongeldige speler." ); } await loadLeaderboard(); } catch (error) { console.error( "Login fout:", error ); localStorage.removeItem( "stb_player" ); location.href = "index.html"; } } async function loadLeaderboard() { const body = document.getElementById( "leaderboard" ); body.innerHTML = ` <tr> <td colspan="5" class="empty" > Laden... </td> </tr> `; const { data, error } = await supabaseClient .from("leaderboard") .select( "player_name,score,kills,wave" ) .order( "score", { ascending: false } ) .order( "kills", { ascending: false } ) .order( "wave", { ascending: false } ) .limit(100); if (error) { console.error( "Leaderboard fout:", error ); body.innerHTML = ` <tr> <td colspan="5" class="error" > Leaderboard kon niet geladen worden. <br> <small> ${escapeHtml( error.message )} </small> </td> </tr> `; return; } if ( !data || data.length === 0 ) { body.innerHTML = ` <tr> <td colspan="5" class="empty" > Nog geen scores. </td> </tr> `; return; } body.innerHTML = ""; data.forEach( function(row, index) { const tr = document.createElement( "tr" ); tr.innerHTML = ` <td class="rank"> ${index + 1} </td> <td> ${escapeHtml( row.player_name )} </td> <td> ${Number( row.score || 0 )} </td> <td> ${Number( row.kills || 0 )} </td> <td> ${Number( row.wave || 1 )} </td> `; body.appendChild( tr ); } ); } function escapeHtml(value) { return String( value ?? "" ) .replaceAll( "&", "&amp;" ) .replaceAll( "<", "&lt;" ) .replaceAll( ">", "&gt;" ) .replaceAll( '"', "&quot;" ) .replaceAll( "'", "&#039;" ); } init(); </script> </body> </html>
