<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Survive the Bots</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, #172554, #020617 65%);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .version {
            position: fixed;
            top: 12px;
            right: 15px;
            color: #94a3b8;
            font-size: 13px;
        }

        .container {
            width: min(1000px, 94%);
            margin: auto;
            padding: 40px 0;
        }

        .card {
            background: rgba(15, 23, 42, .94);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
        }

        h2 {
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            background: #020617;
            color: white;
            border: 1px solid #475569;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            margin: 5px;
        }

        button:hover {
            background: #0369a1;
        }

        .danger {
            background: #dc2626;
        }

        .danger:hover {
            background: #b91c1c;
        }

        .success {
            background: #16a34a;
        }

        .hidden {
            display: none !important;
        }

        .auth {
            max-width: 420px;
            margin: 70px auto;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tabs button {
            flex: 1;
            background: #1e293b;
        }

        .tabs button.active {
            background: #0284c7;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: #1e293b;
            color: #cbd5e1;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #020617;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        #game {
            position: relative;
            width: 100%;
            height: 520px;
            overflow: hidden;
            background:
                linear-gradient(#111827 1px, transparent 1px),
                linear-gradient(90deg, #111827 1px, transparent 1px),
                #030712;
            background-size: 40px 40px;
            border: 2px solid #334155;
            border-radius: 15px;
        }

        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #22c55e;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #22c55e;
        }

        .bot {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 15px #ef4444;
        }

        .bullet {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #facc15;
            border-radius: 50%;
        }

        .weapons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .weapon {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 12px;
        }

        .weapon.active {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56,189,248,.25);
        }

        .weapon-image {
            width: 100%;
            height: 100px;
            object-fit: contain;
            background: #020617;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th {
            color: #38bdf8;
        }

        .leaderboard {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="version">
    Survive the Bots v1.2.0
</div>

<div class="container">

    <!-- LOGIN -->

    <section id="authSection" class="auth card">

        <h1>🎮 Survive the Bots</h1>

        <div class="tabs">
            <button id="loginTab" class="active">
                Inloggen
            </button>

            <button id="registerTab">
                Registreren
            </button>
        </div>

        <div id="loginForm">

            <input
                id="loginUsername"
                placeholder="Gebruikersnaam"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Wachtwoord"
                autocomplete="current-password"
            >

            <button onclick="login()">
                Inloggen
            </button>

        </div>

        <div id="registerForm" class="hidden">

            <input
                id="registerUsername"
                placeholder="Gebruikersnaam"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Wachtwoord"
                autocomplete="new-password"
            >

            <button onclick="register()">
                Account maken
            </button>

        </div>

        <div id="authMessage" class="message hidden"></div>

    </section>


    <!-- GAME -->

    <section id="gameSection" class="hidden">

        <div class="hud">

            <div>
                👤 <span id="usernameDisplay">-</span>
            </div>

            <div>
                💰 <span id="coinsDisplay">0</span>
            </div>

            <div>
                ❤️ <span id="healthDisplay">100</span>
            </div>

            <div>
                💀 Kills:
                <span id="killsDisplay">0</span>
            </div>

            <div>
                🌊 Wave:
                <span id="waveDisplay">1</span>
            </div>

            <button
                id="adminButton"
                class="hidden"
                onclick="openAdmin()"
            >
                👑 Admin
            </button>

            <button
                class="danger"
                onclick="logout()"
            >
                Uitloggen
            </button>

        </div>


        <div class="card">

            <h1>Survive the Bots</h1>

            <p>
                Beweeg met <b>WASD</b> of de pijltjestoetsen.
                Klik om te schieten.
            </p>

            <button
                class="success"
                onclick="startGame()"
            >
                ▶ Start game
            </button>

            <div id="game">

                <div id="player"></div>

            </div>

        </div>


        <!-- WAPENS -->

        <div class="card" style="margin-top:20px">

            <h2>🔫 Mijn wapens</h2>

            <div id="weapons" class="weapons">
                Laden...
            </div>

        </div>


        <!-- LEADERBOARD -->

        <div class="card leaderboard">

            <h2>🏆 Leaderboard</h2>

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Speler</th>
                        <th>Score</th>
                        <th>Kills</th>
                        <th>Wave</th>
                    </tr>

                </thead>

                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="5">
                            Laden...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</div>


<script src="supabase-config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ============================================================
// STATE
// ============================================================

let currentPlayer = null;

let selectedWeapon = null;

let gameRunning = false;

let health = 100;

let kills = 0;

let wave = 1;

let score = 0;

let bots = [];

let keys = {};


// ============================================================
// AUTH TABS
// ============================================================

document
    .getElementById("loginTab")
    .onclick = () => {

        document
            .getElementById("loginTab")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.remove("active");

        document
            .getElementById("loginForm")
            .classList.remove("hidden");

        document
            .getElementById("registerForm")
            .classList.add("hidden");
    };


document
    .getElementById("registerTab")
    .onclick = () => {

        document
            .getElementById("registerTab")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.remove("active");

        document
            .getElementById("registerForm")
            .classList.remove("hidden");

        document
            .getElementById("loginForm")
            .classList.add("hidden");
    };


// ============================================================
// MESSAGE
// ============================================================

function showMessage(message) {

    const box =
        document.getElementById("authMessage");

    box.textContent = message;

    box.classList.remove("hidden");
}


// ============================================================
// REGISTER
// ============================================================

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;


    if (!username || !password) {

        showMessage(
            "Vul een gebruikersnaam en wachtwoord in."
        );

        return;
    }


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "register_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            showMessage(error.message);

            return;
        }


        showMessage(
            "Account aangemaakt! Je kunt nu inloggen."
        );


        document
            .getElementById("loginTab")
            .click();


        document
            .getElementById("loginUsername")
            .value = username;


    } catch (error) {

        console.error(error);

        showMessage(
            "Er ging iets mis bij het registreren."
        );
    }
}


// ============================================================
// LOGIN
// ============================================================

async function login() {

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!username || !password) {

        showMessage(
            "Vul je gebruikersnaam en wachtwoord in."
        );

        return;
    }


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "login_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            showMessage(error.message);

            return;
        }


        currentPlayer =
            typeof data === "string"
                ? JSON.parse(data)
                : data;


        localStorage.setItem(
            "stb_player",
            JSON.stringify(currentPlayer)
        );


        showGame();


    } catch (error) {

        console.error(error);

        showMessage(
            "Er ging iets mis bij het inloggen."
        );
    }
}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    currentPlayer = null;

    localStorage.removeItem("stb_player");

    location.reload();
}


// ============================================================
// SHOW GAME
// ============================================================

function showGame() {

    document
        .getElementById("authSection")
        .classList.add("hidden");


    document
        .getElementById("gameSection")
        .classList.remove("hidden");


    document
        .getElementById("usernameDisplay")
        .textContent =
        currentPlayer.username;


    document
        .getElementById("coinsDisplay")
        .textContent =
        currentPlayer.coins;


    if (currentPlayer.role === "admin") {

        document
            .getElementById("adminButton")
            .classList.remove("hidden");
    }


    loadWeapons();

    loadLeaderboard();
}


// ============================================================
// ADMIN
// ============================================================

function openAdmin() {

    window.location.href =
        "admin.html";
}


// ============================================================
// LOAD WEAPONS
// ============================================================

async function loadWeapons() {

    const { data, error } =
        await supabaseClient.rpc(
            "get_player_weapons",
            {
                p_user_id: currentPlayer.id
            }
        );


    const container =
        document.getElementById("weapons");


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Wapens konden niet geladen worden.</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>Je hebt nog geen wapens.</p>";

        return;
    }


    container.innerHTML = "";


    data.forEach(weapon => {

        const div =
            document.createElement("div");

        div.className = "weapon";


        const image =
            weapon.image_url
                ? `<img class="weapon-image"
                     src="${escapeHtml(weapon.image_url)}"
                     alt="">`
                : `<div style="font-size:60px;text-align:center">
                     ${escapeHtml(weapon.icon || "🔫")}
                   </div>`;


        div.innerHTML = `

            ${image}

            <h3>${escapeHtml(weapon.name)}</h3>

            <p>
                Damage: ${weapon.damage}<br>
                Fire rate: ${weapon.fire_rate}ms<br>
                Kogels: ${weapon.bullets}
            </p>

            <button onclick="selectWeapon('${escapeHtml(weapon.weapon_id)}')">
                Gebruiken
            </button>

        `;


        container.appendChild(div);

    });
}


function selectWeapon(id) {

    selectedWeapon = id;

    document
        .querySelectorAll(".weapon")
        .forEach(x =>
            x.classList.remove("active")
        );


    event
        .currentTarget
        .parentElement
        .classList.add("active");
}


// ============================================================
// LEADERBOARD
// ============================================================

async function loadLeaderboard() {

    const { data, error } =
        await supabaseClient

            .from("leaderboard")

            .select(
                "player_name,score,kills,wave"
            )

            .order(
                "score",
                {
                    ascending: false
                }
            )

            .limit(10);


    const body =
        document.getElementById(
            "leaderboardBody"
        );


    if (error) {

        console.error(error);

        body.innerHTML =
            `<tr>
                <td colspan="5">
                    Leaderboard kon niet geladen worden.
                </td>
             </tr>`;

        return;
    }


    body.innerHTML = "";


    (data || []).forEach(
        (row, index) => {

            body.innerHTML += `

                <tr>

                    <td>${index + 1}</td>

                    <td>${escapeHtml(row.player_name)}</td>

                    <td>${row.score}</td>

                    <td>${row.kills}</td>

                    <td>${row.wave}</td>

                </tr>

            `;

        }
    );
}


// ============================================================
// GAME
// ============================================================

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");


document.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);


game.addEventListener(
    "click",
    shoot
);


function startGame() {

    gameRunning = true;

    health = 100;

    kills = 0;

    wave = 1;

    score = 0;

    bots.forEach(bot =>
        bot.element.remove()
    );

    bots = [];

    updateHud();

    spawnBots();

    requestAnimationFrame(gameLoop);
}


function gameLoop() {

    if (!gameRunning) return;


    movePlayer();

    moveBots();

    checkCollisions();

    requestAnimationFrame(gameLoop);
}


function movePlayer() {

    const speed = 4;

    let left =
        parseFloat(player.style.left || "50%");

    let top =
        parseFloat(player.style.top || "50%");


    if (keys["w"] || keys["arrowup"])
        top -= speed;

    if (keys["s"] || keys["arrowdown"])
        top += speed;

    if (keys["a"] || keys["arrowleft"])
        left -= speed;

    if (keys["d"] || keys["arrowright"])
        left += speed;


    left =
        Math.max(
            2,
            Math.min(98, left)
        );

    top =
        Math.max(
            3,
            Math.min(97, top)
        );


    player.style.left =
        left + "%";

    player.style.top =
        top + "%";
}


function spawnBots() {

    for (
        let i = 0;
        i < 5 + wave;
        i++
    ) {

        const bot =
            document.createElement("div");

        bot.className = "bot";


        const side =
            Math.floor(
                Math.random() * 4
            );


        let x;
        let y;


        if (side === 0) {

            x = 2;
            y = Math.random() * 95;

        } else if (side === 1) {

            x = 95;
            y = Math.random() * 95;

        } else if (side === 2) {

            x = Math.random() * 95;
            y = 2;

        } else {

            x = Math.random() * 95;
            y = 95;

        }


        bot.style.left = x + "%";

        bot.style.top = y + "%";


        game.appendChild(bot);


        bots.push({

            element: bot,

            x: x,

            y: y,

            speed:
                .08 +
                Math.random() * .08

        });

    }
}


function moveBots() {

    const playerX =
        parseFloat(player.style.left);

    const playerY =
        parseFloat(player.style.top);


    bots.forEach(bot => {

        const dx =
            playerX - bot.x;

        const dy =
            playerY - bot.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance > 1) {

            bot.x +=
                dx / distance *
                bot.speed;

            bot.y +=
                dy / distance *
                bot.speed;

        }


        bot.element.style.left =
            bot.x + "%";

        bot.element.style.top =
            bot.y + "%";

    });
}


function checkCollisions() {

    const px =
        parseFloat(player.style.left);

    const py =
        parseFloat(player.style.top);


    bots.forEach(bot => {

        const dx =
            px - bot.x;

        const dy =
            py - bot.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance < 3) {

            health -= 0.5;

            updateHud();


            if (health <= 0) {

                gameOver();

            }

        }

    });
}


function shoot(e) {

    if (!gameRunning) return;


    const bullet =
        document.createElement("div");

    bullet.className =
        "bullet";


    const rect =
        game.getBoundingClientRect();


    const x =
        e.clientX -
        rect.left;


    const y =
        e.clientY -
        rect.top;


    bullet.style.left =
        x + "px";

    bullet.style.top =
        y + "px";


    game.appendChild(bullet);


    setTimeout(
        () => bullet.remove(),
        500
    );


    // Simpele test-kill.
    // Later kunnen we dit vervangen
    // door echte projectile collision.

    let closest = null;

    let closestDistance = Infinity;


    bots.forEach(bot => {

        const dx =
            x -
            (
                bot.x / 100 *
                game.clientWidth
            );

        const dy =
            y -
            (
                bot.y / 100 *
                game.clientHeight
            );


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance < closestDistance) {

            closestDistance = distance;

            closest = bot;

        }

    });


    if (
        closest &&
        closestDistance < 70
    ) {

        closest.element.remove();

        bots =
            bots.filter(
                b => b !== closest
            );


        kills++;

        score += 10;

        updateHud();


        if (bots.length === 0) {

            wave++;

            spawnBots();

        }

    }
}


function gameOver() {

    gameRunning = false;

    alert(
        `Game over!\nScore: ${score}\nKills: ${kills}`
    );


    saveScore();
}


function updateHud() {

    document
        .getElementById("healthDisplay")
        .textContent =
        Math.max(
            0,
            Math.round(health)
        );


    document
        .getElementById("killsDisplay")
        .textContent =
        kills;


    document
        .getElementById("waveDisplay")
        .textContent =
        wave;
}


// ============================================================
// SAVE SCORE
// ============================================================

async function saveScore() {

    const { error } =
        await supabaseClient
            .from("leaderboard")
            .insert({

                user_id:
                    currentPlayer.id,

                player_name:
                    currentPlayer.username,

                score: score,

                kills: kills,

                wave: wave

            });


    if (error) {

        console.error(
            "Score opslaan mislukt:",
            error
        );

    } else {

        loadLeaderboard();

    }
}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ============================================================
// AUTO LOGIN
// ============================================================

try {

    const saved =
        localStorage.getItem(
            "stb_player"
        );


    if (saved) {

        currentPlayer =
            JSON.parse(saved);

        showGame();

    }

} catch (error) {

    console.error(error);

    localStorage.removeItem(
        "stb_player"
    );
}

</script>

</body>
</html>
