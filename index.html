<!DOCTYPE html>

<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #070a11;

    color: white;

    font-family: Arial, sans-serif;
}

canvas {

    display: block;

    width: 100%;
    height: 100%;

    background: #090d16;
}

button {

    border: none;

    border-radius: 10px;

    padding: 12px 18px;

    margin: 5px;

    background: #20c997;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    filter: brightness(1.15);
}

button.secondary {

    background: #26334d;
}

input {

    width: 100%;

    max-width: 350px;

    padding: 13px;

    margin: 6px;

    border: 0;

    border-radius: 9px;

    font-size: 16px;
}

.screen {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(3,5,10,.96);
}

.panel {

    width: min(94%, 850px);

    max-height: 92vh;

    overflow-y: auto;

    padding: 30px;

    background: #101725;

    border: 1px solid #2a3955;

    border-radius: 20px;

    box-shadow:
        0 0 60px rgba(0,200,255,.12);

    text-align: center;
}

h1 {

    margin-top: 0;

    color: #36d9ff;

    font-size: 42px;

    text-shadow:
        0 0 20px
        rgba(54,217,255,.6);
}

h2 {

    color: #36d9ff;
}

.hidden {

    display: none !important;
}

.version {

    color: #78869f;

    margin-bottom: 25px;

    font-size: 14px;
}

.error {

    color: #ff6678;

    min-height: 20px;

    margin: 10px;
}

.success {

    color: #20c997;
}

#hud {

    position: fixed;

    top: 12px;

    left: 15px;

    z-index: 5;

    line-height: 1.7;

    font-weight: bold;

    text-shadow:
        0 2px 5px #000;
}

#account {

    position: fixed;

    top: 12px;

    right: 15px;

    z-index: 5;

    background: rgba(10,15,25,.8);

    padding: 8px 12px;

    border-radius: 10px;
}

#bossBar {

    position: fixed;

    top: 15px;

    left: 50%;

    transform: translateX(-50%);

    width: min(450px,70%);

    display: none;

    z-index: 5;
}

.bar {

    height: 15px;

    overflow: hidden;

    background: #222;

    border-radius: 10px;
}

.barFill {

    height: 100%;

    background: #ff4057;
}

.shopGrid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(170px,1fr)
        );

    gap: 12px;
}

.card {

    padding: 18px;

    background: #182238;

    border: 1px solid #2c3b59;

    border-radius: 14px;
}

.card.selected {

    border-color: #36d9ff;

    box-shadow:
        0 0 20px
        rgba(54,217,255,.2);
}

.icon {

    font-size: 35px;
}

@media (max-width:700px) {

    h1 {
        font-size: 30px;
    }

    #hud {
        font-size: 13px;
    }
}

</style>

</head>

<script>

/* ============================================================
   CONFIG
============================================================ */

const GAME_VERSION = "1.1.0";


const SUPABASE_URL =
    "https://neodeghkonbotgdsivwx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_k7sEatMNh2lPj7WvL1CnyA_N0-4RGpL";


/* ============================================================
   SUPABASE
============================================================ */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   GAME
============================================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


const keys = {};

const mouse = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    down: false
};


document.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;
    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


canvas.addEventListener(
    "mousemove",
    e => {

        mouse.x = e.clientX;

        mouse.y = e.clientY;
    }
);


canvas.addEventListener(
    "mousedown",
    () => mouse.down = true
);


canvas.addEventListener(
    "mouseup",
    () => mouse.down = false
);


/* ============================================================
   ACCOUNT
============================================================ */

let currentUser = null;

let profile = null;

let authMode = "login";


async function loadUser() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getUser();


    currentUser =
        data?.user || null;


    if (!currentUser) {

        showMenu();

        return;
    }


    await loadProfile();

    await loadWeapons();

    showGameMenu();
}


async function loadProfile() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("profiles")

            .select(
                "id,email,display_name,coins"
            )

            .eq(
                "id",
                currentUser.id
            )

            .single();


    if (error) {

        console.error(error);

        return;
    }


    profile = data;

    updateAccountUI();
}


function updateAccountUI() {

    if (!profile) {
        return;
    }


    const name =
        profile.display_name ||
        currentUser.email;


    document.getElementById(
        "accountName"
    ).textContent = name;


    document.getElementById(
        "menuCoins"
    ).textContent =
        profile.coins;


    document.getElementById(
        "shopCoins"
    ).textContent =
        profile.coins;
}


/* ============================================================
   AUTH
============================================================ */

function showLogin() {

    authMode = "login";

    document.getElementById(
        "authTitle"
    ).textContent =
        "🔑 INLOGGEN";


    document.getElementById(
        "auth"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "authError"
    ).textContent = "";
}


function showRegister() {

    authMode = "register";

    document.getElementById(
        "authTitle"
    ).textContent =
        "👤 ACCOUNT MAKEN";


    document.getElementById(
        "auth"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "authError"
    ).textContent = "";
}


function closeAuth() {

    document.getElementById(
        "auth"
    ).classList.add(
        "hidden"
    );
}


async function submitAuth() {

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const errorBox =
        document.getElementById(
            "authError"
        );


    errorBox.textContent = "";


    if (!email || !password) {

        errorBox.textContent =
            "Vul e-mail en wachtwoord in.";

        return;
    }


    let result;


    if (authMode === "register") {

        result =
            await supabaseClient
                .auth
                .signUp({

                    email,

                    password
                });

    } else {

        result =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email,

                    password
                });
    }


    if (result.error) {

        console.error(
            result.error
        );


        errorBox.textContent =
            result.error.message;

        return;
    }


    if (
        authMode === "register" &&
        !result.data.session
    ) {

        errorBox.textContent =
            "Account gemaakt. Controleer je e-mail om je account te bevestigen.";

        return;
    }


    closeAuth();

    await loadUser();
}


async function logout() {

    await supabaseClient
        .auth
        .signOut();


    currentUser = null;

    profile = null;

    gameRunning = false;

    document.getElementById(
        "hud"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "account"
    ).classList.add(
        "hidden"
    );

    showMenu();
}


/* ============================================================
   MENUS
============================================================ */

function hideAllScreens() {

    document
        .querySelectorAll(".screen")
        .forEach(
            element => {

                element.classList.add(
                    "hidden"
                );
            }
        );
}


function showMenu() {

    hideAllScreens();


    document.getElementById(
        "menu"
    ).classList.remove(
        "hidden"
    );
}


function showGameMenu() {

    hideAllScreens();


    document.getElementById(
        "gameMenu"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "account"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "gameMenuName"
    ).textContent =
        profile?.display_name ||
        currentUser.email;


    updateAccountUI();
}


function returnToMenu() {

    gameRunning = false;

    document.getElementById(
        "hud"
    ).classList.add(
        "hidden"
    );


    showGameMenu();
}


/* ============================================================
   DATABASE WEAPONS
============================================================ */

let weapons = {};

let ownedWeapons = [];


async function loadWeapons() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("weapons")

            .select("*")

            .eq(
                "active",
                true
            );


    if (error) {

        console.error(
            "Weapons laden:",
            error
        );

        return;
    }


    weapons = {};


    data.forEach(
        weapon => {

            weapons[
                weapon.id
            ] = weapon;
        }
    );


    const {
        data: owned,
        error: ownedError
    } =
        await supabaseClient

            .from("user_weapons")

            .select("weapon_id")

            .eq(
                "user_id",
                currentUser.id
            );


    if (ownedError) {

        console.error(
            ownedError
        );

        return;
    }


    ownedWeapons =
        owned.map(
            row =>
                row.weapon_id
        );
}


/* ============================================================
   BUY WEAPON
============================================================ */

async function buyWeapon(
    weaponId
) {

    const weapon =
        weapons[weaponId];


    if (!weapon) {
        return;
    }


    if (
        ownedWeapons.includes(
            weaponId
        )
    ) {

        selectWeapon(
            weaponId
        );

        return;
    }


    if (
        profile.coins <
        weapon.price
    ) {

        alert(
            "Je hebt niet genoeg coins."
        );

        return;
    }


    /*
       Eerst aankoop proberen te
       registreren.
    */

    const {
        error: purchaseError
    } =
        await supabaseClient

            .from(
                "shop_purchases"
            )

            .insert({

                user_id:
                    currentUser.id,

                item_type:
                    "weapon",

                item_id:
                    weaponId,

                price:
                    weapon.price
            });


    if (purchaseError) {

        console.error(
            purchaseError
        );

        alert(
            "Aankoop kon niet worden geregistreerd."
        );

        return;
    }


    /*
       Wapen toevoegen aan account.
    */

    const {
        error: weaponError
    } =
        await supabaseClient

            .from(
                "user_weapons"
            )

            .insert({

                user_id:
                    currentUser.id,

                weapon_id:
                    weaponId,

                source:
                    "purchase"
            });


    if (weaponError) {

        console.error(
            weaponError
        );

        alert(
            "Wapen kon niet worden toegevoegd."
        );

        return;
    }


    /*
       Coins aanpassen.
    */

    const newCoins =
        profile.coins -
        weapon.price;


    const {
        error: coinError
    } =
        await supabaseClient

            .from("profiles")

            .update({

                coins:
                    newCoins
            })

            .eq(
                "id",
                currentUser.id
            );


    if (coinError) {

        console.error(
            coinError
        );

        alert(
            "Coins konden niet worden aangepast."
        );

        return;
    }


    profile.coins =
        newCoins;


    ownedWeapons.push(
        weaponId
    );


    await loadWeapons();

    updateAccountUI();

    renderShop();

    alert(
        `${weapon.name} gekocht!`
    );
}


/* ============================================================
   SELECT WEAPON
============================================================ */

let selectedWeapon =
    "pistol";


function selectWeapon(
    weaponId
) {

    if (
        !ownedWeapons.includes(
            weaponId
        )
    ) {

        return;
    }


    selectedWeapon =
        weaponId;


    renderShop();
}


/* ============================================================
   SHOP
============================================================ */

function openShop() {

    if (!currentUser) {

        showLogin();

        return;
    }


    gameRunning = false;

    hideAllScreens();


    document.getElementById(
        "shop"
    ).classList.remove(
        "hidden"
    );


    renderShop();
}


function closeShop() {

    showGameMenu();
}


function renderShop() {

    const shop =
        document.getElementById(
            "weaponShop"
        );


    shop.innerHTML = "";


    Object.values(
        weapons
    ).forEach(
        weapon => {

            const owned =
                ownedWeapons.includes(
                    weapon.id
                );


            const selected =
                selectedWeapon ===
                weapon.id;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card" +
                (
                    selected
                        ? " selected"
                        : ""
                );


            let buttonText;


            if (selected) {

                buttonText =
                    "GESELECTEERD";

            } else if (owned) {

                buttonText =
                    "GEBRUIKEN";

            } else {

                buttonText =
                    `🪙 ${weapon.price}`;
            }


            card.innerHTML = `

                <div class="icon">
                    ${weapon.icon}
                </div>

                <h3>
                    ${escapeHtml(
                        weapon.name
                    )}
                </h3>

                <p>
                    Damage:
                    ${weapon.damage}

                    <br>

                    Fire rate:
                    ${weapon.fire_rate}ms
                </p>

                <button
                    ${
                        selected
                            ? "disabled"
                            : ""
                    }
                >
                    ${buttonText}
                </button>
            `;


            const button =
                card.querySelector(
                    "button"
                );


            if (!selected) {

                button.onclick =
                    async () => {

                        if (owned) {

                            selectWeapon(
                                weapon.id
                            );

                        } else {

                            await buyWeapon(
                                weapon.id
                            );
                        }
                    };
            }


            shop.appendChild(
                card
            );
        }
    );


    updateAccountUI();
}


/* ============================================================
   GAME
============================================================ */

let player;

let bullets = [];

let enemies = [];

let particles = [];

let kills = 0;

let wave = 1;

let spawnTimer = 0;

let lastShot = 0;

let gameRunning = false;

let boss = null;

let upgradeStats = {

    damage: 1,

    speed: 1,

    fire: 1
};


function startGame() {

    if (!currentUser) {

        showLogin();

        return;
    }


    hideAllScreens();


    document.getElementById(
        "hud"
    ).classList.remove(
        "hidden"
    );


    player = {

        x:
            canvas.width / 2,

        y:
            canvas.height / 2,

        radius: 18,

        hp: 100,

        maxHp: 100,

        speed: 4,

        damage:
            weapons[
                selectedWeapon
            ]?.damage || 25,

        fireRate:
            weapons[
                selectedWeapon
            ]?.fire_rate || 300
    };


    bullets = [];

    enemies = [];

    particles = [];

    kills = 0;

    wave = 1;

    spawnTimer = 0;

    lastShot = 0;

    boss = null;


    upgradeStats = {

        damage: 1,

        speed: 1,

        fire: 1
    };


    gameRunning = true;


    document.getElementById(
        "bossBar"
    ).style.display =
        "none";


    updateHUD();


    requestAnimationFrame(
        gameLoop
    );
}


function shoot() {

    const now =
        performance.now();


    const weapon =
        weapons[
            selectedWeapon
        ];


    if (!weapon) {
        return;
    }


    if (
        now - lastShot <
        player.fireRate
    ) {

        return;
    }


    lastShot = now;


    const baseAngle =
        Math.atan2(

            mouse.y -
                player.y,

            mouse.x -
                player.x
        );


    for (
        let i = 0;

        i < weapon.bullets;

        i++
    ) {

        const angle =
            baseAngle +
            (
                Math.random() -
                .5
            ) *
            Number(
                weapon.spread
            );


        bullets.push({

            x: player.x,

            y: player.y,

            vx:
                Math.cos(angle) *
                Number(
                    weapon.bullet_speed
                ),

            vy:
                Math.sin(angle) *
                Number(
                    weapon.bullet_speed
                ),

            radius: 5,

            damage:
                player.damage
        });
    }
}


function spawnEnemy() {

    if (boss) {
        return;
    }


    const side =
        Math.floor(
            Math.random() * 4
        );


    let x;

    let y;


    if (side === 0) {

        x =
            Math.random() *
            canvas.width;

        y = -40;

    } else if (side === 1) {

        x =
            canvas.width + 40;

        y =
            Math.random() *
            canvas.height;

    } else if (side === 2) {

        x =
            Math.random() *
            canvas.width;

        y =
            canvas.height + 40;

    } else {

        x = -40;

        y =
            Math.random() *
            canvas.height;
    }


    const strength =
        1 +
        wave * .12;


    enemies.push({

        x,

        y,

        radius: 17,

        hp:
            50 * strength,

        maxHp:
            50 * strength,

        speed:
            1 +
            wave * .04,

        damage: 10
    });
}


function spawnBoss() {

    boss = {

        x:
            canvas.width / 2,

        y: -80,

        radius: 55,

        hp:
            1000 +
            wave * 150,

        maxHp:
            1000 +
            wave * 150,

        speed:
            .7 +
            wave * .02,

        damage: 25
    };


    document.getElementById(
        "bossBar"
    ).style.display =
        "block";
}


function createParticles(
    x,
    y,
    color
) {

    for (
        let i = 0;

        i < 12;

        i++
    ) {

        particles.push({

            x,

            y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 5,

            vy:
                (
                    Math.random() -
                    .5
                ) * 5,

            life: 30,

            color
        });
    }
}


function update() {

    let dx = 0;

    let dy = 0;


    if (keys["w"]) dy--;

    if (keys["s"]) dy++;

    if (keys["a"]) dx--;

    if (keys["d"]) dx++;


    if (dx || dy) {

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx /= length;

        dy /= length;


        player.x +=
            dx *
            player.speed;


        player.y +=
            dy *
            player.speed;
    }


    player.x =
        Math.max(
            player.radius,
            Math.min(
                canvas.width -
                player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                canvas.height -
                player.radius,
                player.y
            )
        );


    if (mouse.down) {
        shoot();
    }


    spawnTimer--;


    if (spawnTimer <= 0) {

        spawnEnemy();

        spawnTimer =
            Math.max(
                12,
                55 -
                wave * 2
            );
    }


    bullets.forEach(
        bullet => {

            bullet.x +=
                bullet.vx;

            bullet.y +=
                bullet.vy;
        }
    );


    bullets =
        bullets.filter(
            b =>
                b.x > -80 &&
                b.x <
                    canvas.width + 80 &&
                b.y > -80 &&
                b.y <
                    canvas.height + 80
        );


    enemies.forEach(
        enemy => {

            const angle =
                Math.atan2(

                    player.y -
                        enemy.y,

                    player.x -
                        enemy.x
                );


            enemy.x +=
                Math.cos(angle) *
                enemy.speed;


            enemy.y +=
                Math.sin(angle) *
                enemy.speed;


            const distance =
                Math.hypot(

                    player.x -
                        enemy.x,

                    player.y -
                        enemy.y
                );


            if (
                distance <
                player.radius +
                enemy.radius
            ) {

                player.hp -=
                    enemy.damage * .03;
            }
        }
    );


    if (boss) {

        const angle =
            Math.atan2(

                player.y -
                    boss.y,

                player.x -
                    boss.x
            );


        boss.x +=
            Math.cos(angle) *
            boss.speed;


        boss.y +=
            Math.sin(angle) *
            boss.speed;


        const distance =
            Math.hypot(

                player.x -
                    boss.x,

                player.y -
                    boss.y
            );


        if (
            distance <
            player.radius +
            boss.radius
        ) {

            player.hp -=
                boss.damage * .015;
        }


        document.getElementById(
            "bossHealth"
        ).style.width =

            Math.max(
                0,
                boss.hp /
                boss.maxHp *
                100
            ) + "%";
    }


    for (
        let bi =
            bullets.length - 1;

        bi >= 0;

        bi--
    ) {

        const bullet =
            bullets[bi];

        let hit = false;


        for (
            let ei =
                enemies.length - 1;

            ei >= 0;

            ei--
        ) {

            const enemy =
                enemies[ei];


            const distance =
                Math.hypot(

                    bullet.x -
                        enemy.x,

                    bullet.y -
                        enemy.y
                );


            if (
                distance <
                bullet.radius +
                enemy.radius
            ) {

                enemy.hp -=
                    bullet.damage;

                hit = true;


                createParticles(
                    bullet.x,
                    bullet.y,
                    "#36d9ff"
                );


                if (
                    enemy.hp <= 0
                ) {

                    enemies.splice(
                        ei,
                        1
                    );

                    kills++;

                    addCoins(5);


                    createParticles(
                        enemy.x,
                        enemy.y,
                        "#ff4057"
                    );
                }

                break;
            }
        }


        if (
            !hit &&
            boss
        ) {

            const distance =
                Math.hypot(

                    bullet.x -
                        boss.x,

                    bullet.y -
                        boss.y
                );


            if (
                distance <
                bullet.radius +
                boss.radius
            ) {

                boss.hp -=
                    bullet.damage;

                hit = true;


                if (
                    boss.hp <= 0
                ) {

                    addCoins(100);

                    kills += 10;

                    boss = null;


                    document.getElementById(
                        "bossBar"
                    ).style.display =
                        "none";
                }
            }
        }


        if (hit) {

            bullets.splice(
                bi,
                1
            );
        }
    }


    if (
        kills >=
            wave * 10 &&
        !boss
    ) {

        wave++;


        if (
            wave % 10 === 0
        ) {

            spawnBoss();

        } else {

            gameRunning = false;


            document.getElementById(
                "upgrade"
            ).classList.remove(
                "hidden"
            );
        }
    }


    particles.forEach(
        p => {

            p.x += p.vx;

            p.y += p.vy;

            p.life--;
        }
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );


    if (
        player.hp <= 0
    ) {

        endGame();
    }


    updateHUD();
}


function addCoins(
    amount
) {

    if (!profile) {
        return;
    }


    /*
       Voor deze versie wordt
       de balans lokaal bijgehouden
       tijdens de game.

       We schrijven hem naar Supabase
       bij game-over.
    */

    profile.coins += amount;
}


function updateHUD() {

    if (!player) {
        return;
    }


    document.getElementById(
        "hp"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                player.hp
            )
        );


    document.getElementById(
        "coins"
    ).textContent =
        profile?.coins || 0;


    document.getElementById(
        "kills"
    ).textContent =
        kills;


    document.getElementById(
        "wave"
    ).textContent =
        wave;


    document.getElementById(
        "weaponName"
    ).textContent =
        weapons[
            selectedWeapon
        ]?.name ||
        "Pistol";
}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.strokeStyle =
        "rgba(70,100,140,.12)";


    for (
        let x = 0;

        x < canvas.width;

        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }


    for (
        let y = 0;

        y < canvas.height;

        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }


    bullets.forEach(
        bullet => {

            ctx.beginPath();

            ctx.arc(
                bullet.x,
                bullet.y,
                bullet.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#36d9ff";

            ctx.shadowColor =
                "#36d9ff";

            ctx.shadowBlur = 15;

            ctx.fill();

            ctx.shadowBlur = 0;
        }
    );


    enemies.forEach(
        enemy => {

            ctx.beginPath();

            ctx.arc(
                enemy.x,
                enemy.y,
                enemy.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ff4057";

            ctx.shadowColor =
                "#ff4057";

            ctx.shadowBlur = 15;

            ctx.fill();

            ctx.shadowBlur = 0;
        }
    );


    if (boss) {

        ctx.beginPath();

        ctx.arc(
            boss.x,
            boss.y,
            boss.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#a970ff";

        ctx.shadowColor =
            "#a970ff";

        ctx.shadowBlur = 30;

        ctx.fill();

        ctx.shadowBlur = 0;
    }


    if (player) {

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#36d9ff";

        ctx.shadowColor =
            "#36d9ff";

        ctx.shadowBlur = 22;

        ctx.fill();

        ctx.shadowBlur = 0;


        const angle =
            Math.atan2(

                mouse.y -
                    player.y,

                mouse.x -
                    player.x
            );


        ctx.save();

        ctx.translate(
            player.x,
            player.y
        );

        ctx.rotate(angle);

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            5,
            -4,
            27,
            8
        );

        ctx.restore();
    }


    particles.forEach(
        particle => {

            ctx.globalAlpha =
                particle.life / 30;

            ctx.fillStyle =
                particle.color;

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    );


    ctx.globalAlpha = 1;
}


function gameLoop() {

    if (!gameRunning) {
        return;
    }


    update();

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* ============================================================
   UPGRADES
============================================================ */

function chooseUpgrade(
    type
) {

    if (
        type ===
        "damage"
    ) {

        upgradeStats.damage *=
            1.3;
    }


    if (
        type ===
        "speed"
    ) {

        upgradeStats.speed *=
            1.2;
    }


    if (
        type ===
        "fire"
    ) {

        upgradeStats.fire *=
            1.25;
    }


    if (
        type ===
        "health"
    ) {

        player.maxHp += 30;

        player.hp += 30;
    }


    const weapon =
        weapons[
            selectedWeapon
        ];


    player.damage =
        Number(
            weapon.damage
        ) *
        upgradeStats.damage;


    player.speed =
        4 *
        upgradeStats.speed;


    player.fireRate =
        Number(
            weapon.fire_rate
        ) /
        upgradeStats.fire;


    document.getElementById(
        "upgrade"
    ).classList.add(
        "hidden"
    );


    gameRunning = true;


    requestAnimationFrame(
        gameLoop
    );
}


/* ============================================================
   SAVE COINS
============================================================ */

async function saveProfileCoins() {

    if (!profile ||
        !currentUser) {

        return;
    }


    const {
        error
    } =
        await supabaseClient

            .from("profiles")

            .update({

                coins:
                    profile.coins
            })

            .eq(
                "id",
                currentUser.id
            );


    if (error) {

        console.error(
            "Coins opslaan:",
            error
        );
    }
}


/* ============================================================
   GAME OVER
============================================================ */

async function endGame() {

    gameRunning = false;


    await saveProfileCoins();


    const score =
        kills * 100 +
        wave * 500;


    document.getElementById(
        "finalKills"
    ).textContent =
        kills;


    document.getElementById(
        "finalWave"
    ).textContent =
        wave;


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "gameOver"
    ).classList.remove(
        "hidden"
    );
}


/* ============================================================
   LEADERBOARD
============================================================ */

async function saveScore() {

    if (!currentUser) {

        alert(
            "Je moet ingelogd zijn."
        );

        return;
    }


    const score =
        kills * 100 +
        wave * 500;


    const {
        error
    } =
        await supabaseClient

            .from("leaderboard")

            .insert({

                user_id:
                    currentUser.id,

                player_name:
                    profile.display_name ||
                    currentUser.email
                    .split("@")[0],

                score,

                kills,

                wave
            });


    if (error) {

        console.error(
            error
        );


        alert(
            "Score opslaan mislukt."
        );

        return;
    }


    alert(
        "🏆 Score opgeslagen!"
    );


    openLeaderboard();
}


async function openLeaderboard() {

    if (!currentUser) {

        showLogin();

        return;
    }


    hideAllScreens();


    document.getElementById(
        "leaderboard"
    ).classList.remove(
        "hidden"
    );


    const list =
        document.getElementById(
            "leaderboardList"
        );


    list.innerHTML =
        "Scores laden...";


    const {
        data,
        error
    } =
        await supabaseClient

            .from("leaderboard")

            .select(
                "player_name,score,kills,wave"
            )

            .order(
                "score",
                {
                    ascending: false
                }
            )

            .limit(10);


    if (error) {

        console.error(
            error
        );


        list.innerHTML =
            "Leaderboard kon niet worden geladen.";

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            "Nog geen scores.";

        return;
    }


    list.innerHTML =
        data
            .map(
                (row,index) => `

                <div class="card">

                    <b>
                        #${index + 1}
                        ${escapeHtml(
                            row.player_name
                        )}
                    </b>

                    <br><br>

                    🏆 ${row.score}

                    &nbsp; | &nbsp;

                    👾 ${row.kills}

                    &nbsp; | &nbsp;

                    🌊 ${row.wave}

                </div>

                `
            )
            .join("");
}


function closeLeaderboard() {

    if (currentUser) {

        showGameMenu();

    } else {

        showMenu();
    }
}


/* ============================================================
   SECURITY
============================================================ */

function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* ============================================================
   AUTH STATE
============================================================ */

supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            currentUser =
                session?.user ||
                null;


            if (currentUser) {

                await loadUser();
            }
        }
    );


/* ============================================================
   STARTUP
============================================================ */

console.log(
    "Survive the Bots " +
    GAME_VERSION +
    " gestart."
);


loadUser();

</script>
