<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Survive the Bots</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #020617 65%
                );

            color: white;
            font-family: Arial, sans-serif;
        }

        .version {
            position: fixed;
            right: 15px;
            bottom: 10px;

            color: #64748b;
            font-size: 12px;
        }

        .card {
            width: min(430px, 100%);

            padding: 30px;

            background: rgba(15, 23, 42, .96);

            border: 1px solid #334155;
            border-radius: 20px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .55);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #38bdf8;
            font-size: 30px;
        }

        .logo p {
            color: #94a3b8;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        button {
            border: 0;
            border-radius: 9px;

            padding: 12px 16px;

            background: #0284c7;
            color: white;

            font-weight: bold;
            cursor: pointer;

            transition:
                background .15s ease,
                transform .1s ease;
        }

        button:hover {
            background: #0369a1;
        }

        button:active {
            transform: scale(.98);
        }

        .tabs button {
            flex: 1;
            background: #1e293b;
        }

        .tabs button.active {
            background: #0284c7;
        }

        input {
            width: 100%;

            padding: 13px;
            margin: 7px 0;

            border: 1px solid #475569;
            border-radius: 9px;

            background: #020617;
            color: white;

            outline: none;
        }

        input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 2px rgba(56, 189, 248, .1);
        }

        input::placeholder {
            color: #64748b;
        }

        .submit {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 11px;

            border-radius: 8px;

            background: #1e293b;
            color: #cbd5e1;

            line-height: 1.4;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #451a1a;
            color: #fecaca;
            border: 1px solid #7f1d1d;
        }

        .message.success {
            background: #052e16;
            color: #bbf7d0;
            border: 1px solid #166534;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: .6;
            pointer-events: none;
        }

        .hint {
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- ======================================================
         LOGO
    ======================================================= -->

    <div class="logo">

        <h1>
            🎮 Survive the Bots
        </h1>

        <p>
            Overleef de bots en bereik de hoogste score!
        </p>

    </div>


    <!-- ======================================================
         TABS
    ======================================================= -->

    <div class="tabs">

        <button
            id="loginTab"
            class="active"
            type="button">

            Inloggen

        </button>


        <button
            id="registerTab"
            type="button">

            Registreren

        </button>

    </div>


    <!-- ======================================================
         LOGIN
    ======================================================= -->

    <div id="loginForm">

        <input
            id="loginUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username"
            maxlength="50"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="submit"
            type="button">

            🎮 Inloggen

        </button>

    </div>


    <!-- ======================================================
         REGISTER
    ======================================================= -->

    <div
        id="registerForm"
        class="hidden">

        <input
            id="registerUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username"
            maxlength="50"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="new-password"
        >

        <input
            id="registerPasswordConfirm"
            type="password"
            placeholder="Wachtwoord opnieuw"
            autocomplete="new-password"
        >

        <button
            id="registerButton"
            class="submit"
            type="button">

            ✨ Account maken

        </button>

    </div>


    <!-- ======================================================
         MESSAGE
    ======================================================= -->

    <div
        id="authMessage"
        class="message">
    </div>


    <div class="hint">
        Survive the Bots v1.3.2
    </div>

</div>


<div class="version">
    Survive the Bots v1.3.2
</div>


<!-- ==========================================================
     SUPABASE
=========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

"use strict";


// ============================================================
// SUPABASE CLIENT
// ============================================================

let supabaseClient = null;

try {

    if (
        typeof SUPABASE_URL === "undefined" ||
        typeof SUPABASE_KEY === "undefined"
    ) {
        throw new Error(
            "SUPABASE_URL of SUPABASE_KEY ontbreekt."
        );
    }

    supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

} catch (error) {

    console.error(
        "Supabase initialisatie mislukt:",
        error
    );

    const box =
        document.getElementById("authMessage");

    box.textContent =
        "Databaseverbinding kon niet worden gestart. Controleer supabase-config.js.";

    box.className =
        "message show error";
}


// ============================================================
// ELEMENTEN
// ============================================================

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");

const authMessage =
    document.getElementById("authMessage");


// ============================================================
// MESSAGE
// ============================================================

function showMessage(
    message,
    type = ""
) {

    authMessage.textContent = message;

    authMessage.className =
        "message show";

    if (type) {
        authMessage.classList.add(type);
    }
}


function clearMessage() {

    authMessage.textContent = "";

    authMessage.className =
        "message";
}


// ============================================================
// LOGIN TAB
// ============================================================

function showLogin() {

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.remove("hidden");

    registerForm.classList.add("hidden");

    clearMessage();

    document
        .getElementById("loginUsername")
        .focus();
}


loginTab.addEventListener(
    "click",
    showLogin
);


// ============================================================
// REGISTER TAB
// ============================================================

function showRegister() {

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.remove("hidden");

    loginForm.classList.add("hidden");

    clearMessage();

    document
        .getElementById("registerUsername")
        .focus();
}


registerTab.addEventListener(
    "click",
    showRegister
);


// ============================================================
// LOGIN
// ============================================================

async function login() {

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!username || !password) {

        showMessage(
            "Vul je gebruikersnaam en wachtwoord in.",
            "error"
        );

        return;
    }


    if (!supabaseClient) {

        showMessage(
            "Databaseverbinding is niet beschikbaar.",
            "error"
        );

        return;
    }


    loginButton.classList.add("loading");

    loginButton.textContent =
        "Bezig met inloggen...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "login_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        console.log(
            "Login response:",
            data
        );


        if (error) {

            console.error(
                "Login error:",
                error
            );

            showMessage(
                error.message ||
                "Inloggen mislukt.",
                "error"
            );

            return;
        }


        if (!data) {

            showMessage(
                "Gebruikersnaam of wachtwoord is incorrect.",
                "error"
            );

            return;
        }


        let player = data;


        if (typeof player === "string") {

            try {

                player =
                    JSON.parse(player);

            } catch (parseError) {

                console.error(
                    "JSON parse error:",
                    parseError
                );

                showMessage(
                    "Ongeldige gegevens ontvangen van de database.",
                    "error"
                );

                return;
            }
        }


        if (Array.isArray(player)) {

            player =
                player[0];
        }


        if (
            !player ||
            !player.id
        ) {

            showMessage(
                "Gebruiker kon niet worden geladen.",
                "error"
            );

            return;
        }


        localStorage.setItem(
            "stb_player",
            JSON.stringify(player)
        );


        showMessage(
            "Inloggen gelukt! Game wordt gestart...",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "game.html";

            },
            400
        );

    } catch (error) {

        console.error(
            "Onverwachte login error:",
            error
        );

        showMessage(
            "Er ging iets mis bij het inloggen.",
            "error"
        );

    } finally {

        loginButton.classList.remove(
            "loading"
        );

        loginButton.textContent =
            "🎮 Inloggen";
    }
}


// ============================================================
// REGISTER
// ============================================================

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const confirm =
        document
            .getElementById("registerPasswordConfirm")
            .value;


    if (
        !username ||
        !password ||
        !confirm
    ) {

        showMessage(
            "Vul alle velden in.",
            "error"
        );

        return;
    }


    if (username.length < 3) {

        showMessage(
            "De gebruikersnaam moet minstens 3 tekens bevatten.",
            "error"
        );

        return;
    }


    if (password.length < 4) {

        showMessage(
            "Het wachtwoord moet minstens 4 tekens bevatten.",
            "error"
        );

        return;
    }


    if (password !== confirm) {

        showMessage(
            "De wachtwoorden zijn niet hetzelfde.",
            "error"
        );

        return;
    }


    if (!supabaseClient) {

        showMessage(
            "Databaseverbinding is niet beschikbaar.",
            "error"
        );

        return;
    }


    registerButton.classList.add(
        "loading"
    );

    registerButton.textContent =
        "Account maken...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "register_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        console.log(
            "Register response:",
            data
        );


        if (error) {

            console.error(
                "Register error:",
                error
            );

            showMessage(
                error.message ||
                "Registreren mislukt.",
                "error"
            );

            return;
        }


        showLogin();


        document
            .getElementById("loginUsername")
            .value =
            username;


        document
            .getElementById("loginPassword")
            .value =
            "";


        showMessage(
            "Account aangemaakt! Je kunt nu inloggen.",
            "success"
        );


        document
            .getElementById("loginPassword")
            .focus();

    } catch (error) {

        console.error(
            "Onverwachte registratie error:",
            error
        );

        showMessage(
            "Er ging iets mis bij het registreren.",
            "error"
        );

    } finally {

        registerButton.classList.remove(
            "loading"
        );

        registerButton.textContent =
            "✨ Account maken";
    }
}


// ============================================================
// BUTTONS
// ============================================================

loginButton.addEventListener(
    "click",
    login
);


registerButton.addEventListener(
    "click",
    register
);


// ============================================================
// ENTER LOGIN
// ============================================================

document
    .getElementById("loginUsername")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                login();
            }
        }
    );


document
    .getElementById("loginPassword")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                login();
            }
        }
    );


// ============================================================
// ENTER REGISTER
// ============================================================

document
    .getElementById("registerUsername")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                register();
            }
        }
    );


document
    .getElementById("registerPassword")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                register();
            }
        }
    );


document
    .getElementById("registerPasswordConfirm")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                register();
            }
        }
    );


// ============================================================
// COMPATIBILITEIT MET OUDE HTML
// ============================================================

window.login =
    login;

window.register =
    register;


// ============================================================
// BESTAANDE LOGIN CONTROLEREN
// ============================================================

(function checkExistingPlayer() {

    try {

        const saved =
            localStorage.getItem(
                "stb_player"
            );


        if (!saved) {
            return;
        }


        const player =
            JSON.parse(saved);


        if (
            player &&
            player.id
        ) {

            console.log(
                "Bestaande speler gevonden:",
                player.username
            );

            window.location.href =
                "game.html";
        }

    } catch (error) {

        console.error(
            "Ongeldige opgeslagen speler:",
            error
        );

        localStorage.removeItem(
            "stb_player"
        );
    }

})();

</script>

</body>
</html>
