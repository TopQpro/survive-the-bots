<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive the Bots</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top, #172554, #020617 65%);
        color: white;
        font-family: Arial, sans-serif;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .version {
        position: fixed;
        top: 12px;
        right: 15px;
        color: #64748b;
        font-size: 12px;
    }

    .container {
        width: min(1000px, 94%);
        margin: auto;
        padding: 60px 0 40px;
    }

    .card {
        background: rgba(15, 23, 42, .96);
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
        margin-top: 0;
        color: #38bdf8;
    }

    h2 {
        color: #e2e8f0;
    }

    p {
        color: #cbd5e1;
    }

    input {
        width: 100%;
        padding: 13px;
        margin: 7px 0;
        background: #020617;
        color: white;
        border: 1px solid #475569;
        border-radius: 9px;
        outline: none;
    }

    input:focus {
        border-color: #38bdf8;
    }

    button {
        padding: 12px 18px;
        border: 0;
        border-radius: 9px;
        background: #0284c7;
        color: white;
        font-weight: bold;
        margin: 5px;
    }

    button:hover {
        background: #0369a1;
    }

    .success {
        background: #16a34a;
    }

    .success:hover {
        background: #15803d;
    }

    .danger {
        background: #dc2626;
    }

    .hidden {
        display: none !important;
    }

    .auth {
        max-width: 430px;
        margin: 50px auto;
    }

    .tabs {
        display: flex;
        gap: 5px;
        margin-bottom: 15px;
    }

    .tabs button {
        flex: 1;
        background: #1e293b;
    }

    .tabs button.active {
        background: #0284c7;
    }

    .message {
        padding: 10px;
        margin-top: 12px;
        border-radius: 8px;
        background: #1e293b;
        color: #cbd5e1;
    }

    .menu {
        max-width: 650px;
        margin: 40px auto;
    }

    .menu-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 20px;
    }

    .menu-buttons button {
        margin: 0;
        min-height: 55px;
    }

    .welcome {
        color: #94a3b8;
    }

    @media (max-width: 600px) {
        .menu-buttons {
            grid-template-columns: 1fr;
        }
    }
</style>

</head> <body> <div class="version"> Survive the Bots v1.3.0 </div> <div class="container">
<!-- LOGIN / REGISTRATIE -->

<section id="authSection" class="auth card">

    <h1>🎮 Survive the Bots</h1>

    <p>
        Log in om te spelen.
    </p>

    <div class="tabs">

        <button
            id="loginTab"
            class="active"
            type="button">
            Inloggen
        </button>

        <button
            id="registerTab"
            type="button">
            Registreren
        </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

        <input
            id="loginUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="current-password"
        >

        <button
            class="success"
            type="button"
            onclick="login()">
            🎮 Inloggen
        </button>

    </div>


    <!-- REGISTRATIE -->

    <div
        id="registerForm"
        class="hidden">

        <input
            id="registerUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username"
        >

        <input
            id="registerPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="new-password"
        >

        <button
            type="button"
            onclick="register()">
            ✨ Account maken
        </button>

    </div>


    <div
        id="authMessage"
        class="message hidden">
    </div>

</section>


<!-- MENU -->

<section
    id="menuSection"
    class="menu card hidden">

    <h1>🎮 Survive the Bots</h1>

    <p class="welcome">
        Welkom, <b id="menuUsername">-</b>!
    </p>

    <p>
        Klaar om de bots te overleven?
    </p>


    <div class="menu-buttons">

        <button
            class="success"
            onclick="location.href='game.html'">
            ▶ Spelen
        </button>

        <button
            onclick="location.href='shop.html'">
            🛒 Shop
        </button>

        <button
            onclick="location.href='inventory.html'">
            🔫 Mijn wapens
        </button>

        <button
            onclick="location.href='leaderboard.html'">
            🏆 Leaderboard
        </button>

        <button
            id="adminButton"
            class="hidden"
            onclick="location.href='admin.html'">
            👑 Admin
        </button>

        <button
            class="danger"
            onclick="logout()">
            Uitloggen
        </button>

    </div>

</section>

</div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="supabase-config.js"></script> <script> const supabaseClient = supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); // ============================================================ // MESSAGE // ============================================================ function showMessage(message) { const box = document.getElementById( "authMessage" ); box.textContent = message; box.classList.remove( "hidden" ); } // ============================================================ // TABS // ============================================================ document .getElementById("loginTab") .addEventListener( "click", function() { document .getElementById("loginTab") .classList.add("active"); document .getElementById("registerTab") .classList.remove("active"); document .getElementById("loginForm") .classList.remove("hidden"); document .getElementById("registerForm") .classList.add("hidden"); document .getElementById("authMessage") .classList.add("hidden"); } ); document .getElementById("registerTab") .addEventListener( "click", function() { document .getElementById("registerTab") .classList.add("active"); document .getElementById("loginTab") .classList.remove("active"); document .getElementById("registerForm") .classList.remove("hidden"); document .getElementById("loginForm") .classList.add("hidden"); document .getElementById("authMessage") .classList.add("hidden"); } ); // ============================================================ // REGISTER // ============================================================ async function register() { const username = document .getElementById( "registerUsername" ) .value .trim(); const password = document .getElementById( "registerPassword" ) .value; if (!username || !password) { showMessage( "Vul een gebruikersnaam en wachtwoord in." ); return; } if (username.length < 3) { showMessage( "De gebruikersnaam moet minstens 3 tekens bevatten." ); return; } if (password.length < 3) { showMessage( "Het wachtwoord moet minstens 3 tekens bevatten." ); return; } try { const { data, error } = await supabaseClient.rpc( "register_player", { p_username: username, p_password: password } ); if (error) { console.error( "Registratie:", error ); showMessage( error.message ); return; } showMessage( "Account aangemaakt! Je kunt nu inloggen." ); document .getElementById( "loginTab" ) .click(); document .getElementById( "loginUsername" ) .value = username; document .getElementById( "loginPassword" ) .value = ""; } catch (error) { console.error(error); showMessage( "Er ging iets mis bij het registreren." ); } } // ============================================================ // LOGIN // ============================================================ async function login() { const username = document .getElementById( "loginUsername" ) .value .trim(); const password = document .getElementById( "loginPassword" ) .value; if (!username || !password) { showMessage( "Vul je gebruikersnaam en wachtwoord in." ); return; } try { const { data, error } = await supabaseClient.rpc( "login_player", { p_username: username, p_password: password } ); if (error) { console.error( "Login:", error ); showMessage( error.message ); return; } let player = data; if (typeof player === "string") { try { player = JSON.parse(player); } catch { player = null; } } if (!player) { showMessage( "Ongeldige gebruikersnaam of wachtwoord." ); return; } /* * Verschillende SQL-functies kunnen * een array teruggeven. */ if (Array.isArray(player)) { player = player[0]; } currentPlayer = player; localStorage.setItem( "stb_player", JSON.stringify( currentPlayer ) ); showMenu(); } catch (error) { console.error(error); showMessage( "Er ging iets mis bij het inloggen." ); } } // ============================================================ // PLAYER // ============================================================ let currentPlayer = null; // ============================================================ // MENU // ============================================================ function showMenu() { document .getElementById( "authSection" ) .classList.add("hidden"); document .getElementById( "menuSection" ) .classList.remove("hidden"); document .getElementById( "menuUsername" ) .textContent = currentPlayer.username; if ( currentPlayer.role === "admin" ) { document .getElementById( "adminButton" ) .classList.remove( "hidden" ); } } // ============================================================ // LOGOUT // ============================================================ function logout() { currentPlayer = null; localStorage.removeItem( "stb_player" ); location.reload(); } // ============================================================ // AUTO LOGIN // ============================================================ try { const saved = localStorage.getItem( "stb_player" ); if (saved) { currentPlayer = JSON.parse(saved); if ( currentPlayer && currentPlayer.username ) { showMenu(); } } } catch (error) { console.error( "Auto login:", error ); localStorage.removeItem( "stb_player" ); } </script> </body> </html>
