<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Survive the Bots</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, #172554, #020617 70%);
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .version {
            position: fixed;
            right: 14px;
            bottom: 10px;
            color: #64748b;
            font-size: 12px;
        }

        .auth-card {
            width: min(430px, 100%);
            background: rgba(15, 23, 42, .97);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #38bdf8;
            font-size: 30px;
        }

        .logo p {
            color: #94a3b8;
            margin-bottom: 0;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px 15px;
            border: 0;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #0369a1;
        }

        .tab {
            background: #1e293b;
        }

        .tab.active {
            background: #0284c7;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            background: #020617;
            color: white;
            border: 1px solid #475569;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .message {
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            background: #1e293b;
            color: #cbd5e1;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #451a1a;
            color: #fecaca;
            border: 1px solid #7f1d1d;
        }

        .message.success {
            background: #052e16;
            color: #bbf7d0;
            border: 1px solid #166534;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: .6;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">
        <h1>🎮 Survive the Bots</h1>
        <p>Overleef de bots en bereik de hoogste score!</p>
    </div>

    <div class="tabs">

        <button
            id="loginTab"
            class="tab active"
            type="button">
            Inloggen
        </button>

        <button
            id="registerTab"
            class="tab"
            type="button">
            Registreren
        </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

        <input
            id="loginUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username">

        <input
            id="loginPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="current-password">

        <button
            id="loginButton"
            type="button">
            🎮 Inloggen
        </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

        <input
            id="registerUsername"
            type="text"
            placeholder="Gebruikersnaam"
            autocomplete="username">

        <input
            id="registerPassword"
            type="password"
            placeholder="Wachtwoord"
            autocomplete="new-password">

        <input
            id="registerPasswordConfirm"
            type="password"
            placeholder="Wachtwoord opnieuw"
            autocomplete="new-password">

        <button
            id="registerButton"
            type="button">
            ✨ Account maken
        </button>

    </div>


    <div
        id="authMessage"
        class="message">
    </div>

</div>

<div class="version">
    Survive the Bots v1.3.1
</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

"use strict";


/* ============================================================
   SUPABASE
============================================================ */

if (
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_KEY === "undefined"
) {

    console.error(
        "SUPABASE_URL of SUPABASE_KEY ontbreekt."
    );

    showMessage(
        "Supabase configuratie ontbreekt. Controleer supabase-config.js.",
        "error"
    );

}


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   ELEMENTEN
============================================================ */

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(message, type = "") {

    const box =
        document.getElementById("authMessage");

    box.textContent = message;

    box.className = "message show";

    if (type) {
        box.classList.add(type);
    }
}


/* ============================================================
   TABS
============================================================ */

loginTab.addEventListener(
    "click",
    function () {

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");

        document
            .getElementById("authMessage")
            .className = "message";
    }
);


registerTab.addEventListener(
    "click",
    function () {

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        document
            .getElementById("authMessage")
            .className = "message";
    }
);


/* ============================================================
   LOGIN
============================================================ */

async function login() {

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!username || !password) {

        showMessage(
            "Vul je gebruikersnaam en wachtwoord in.",
            "error"
        );

        return;
    }


    loginButton.classList.add("loading");

    loginButton.textContent = "Bezig met inloggen...";


    try {

        /*
         * We gebruiken hier de eigen database-login.
         *
         * Dit voorkomt de Supabase email-rate-limit.
         */

        const { data, error } =
            await supabaseClient.rpc(
                "login_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            console.error(
                "Login error:",
                error
            );

            showMessage(
                "Inloggen mislukt: " +
                error.message,
                "error"
            );

            return;
        }


        if (!data) {

            showMessage(
                "Gebruikersnaam of wachtwoord is incorrect.",
                "error"
            );

            return;
        }


        let player;


        try {

            player =
                typeof data === "string"
                    ? JSON.parse(data)
                    : data;

        } catch (e) {

            console.error(
                "Login response:",
                data
            );

            showMessage(
                "Ongeldige login-response.",
                "error"
            );

            return;
        }


        /*
         * Sommige RPC's geven een array terug.
         */

        if (Array.isArray(player)) {
            player = player[0];
        }


        if (
            !player ||
            !player.id
        ) {

            showMessage(
                "Gebruiker kon niet worden geladen.",
                "error"
            );

            return;
        }


        /*
         * Bewaar de speler zodat game.html
         * weet wie er ingelogd is.
         */

        localStorage.setItem(
            "stb_player",
            JSON.stringify(player)
        );


        showMessage(
            "Inloggen gelukt! Game wordt gestart...",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "game.html";

            },
            400
        );


    } catch (error) {

        console.error(
            "Onverwachte login error:",
            error
        );

        showMessage(
            "Er ging iets mis bij het inloggen.",
            "error"
        );

    } finally {

        loginButton.classList.remove("loading");

        loginButton.textContent =
            "🎮 Inloggen";

    }
}


/* ============================================================
   REGISTER
============================================================ */

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("registerPasswordConfirm")
            .value;


    if (!username || !password) {

        showMessage(
            "Vul een gebruikersnaam en wachtwoord in.",
            "error"
        );

        return;
    }


    if (username.length < 3) {

        showMessage(
            "Je gebruikersnaam moet minstens 3 tekens bevatten.",
            "error"
        );

        return;
    }


    if (password.length < 4) {

        showMessage(
            "Je wachtwoord moet minstens 4 tekens bevatten.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "De wachtwoorden zijn niet hetzelfde.",
            "error"
        );

        return;
    }


    registerButton.classList.add("loading");

    registerButton.textContent =
        "Account wordt gemaakt...";


    try {

        /*
         * Eigen database registratie.
         *
         * Geen Supabase Auth signup,
         * dus geen email-verificatie
         * en geen email-rate-limit.
         */

        const { data, error } =
            await supabaseClient.rpc(
                "register_player",
                {
                    p_username: username,
                    p_password: password
                }
            );


        if (error) {

            console.error(
                "Register error:",
                error
            );

            showMessage(
                "Registreren mislukt: " +
                error.message,
                "error"
            );

            return;
        }


        showMessage(
            "Account aangemaakt! Je kunt nu inloggen.",
            "success"
        );


        /*
         * Ga automatisch naar login.
         */

        loginTab.click();


        document
            .getElementById("loginUsername")
            .value = username;

        document
            .getElementById("loginPassword")
            .focus();


    } catch (error) {

        console.error(
            "Onverwachte registratie error:",
            error
        );

        showMessage(
            "Er ging iets mis bij het registreren.",
            "error"
        );

    } finally {

        registerButton.classList.remove("loading");

        registerButton.textContent =
            "✨ Account maken";

    }
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

loginButton.addEventListener(
    "click",
    login
);

registerButton.addEventListener(
    "click",
    register
);


/* ============================================================
   ENTER = LOGIN
============================================================ */

document
    .getElementById("loginPassword")
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                login();
            }

        }
    );


/* ============================================================
   ENTER = REGISTER
============================================================ */

document
    .getElementById("registerPasswordConfirm")
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                register();
            }

        }
    );


/* ============================================================
   GLOBAL FUNCTIES
============================================================ */

/*
 * Deze twee regels zijn belangrijk als je ergens nog
 * onclick="login()" of onclick="register()" gebruikt.
 */

window.login = login;
window.register = register;

</script>

</body>
</html>
