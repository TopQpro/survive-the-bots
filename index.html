<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Survive the Bots - Login</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top, #172554, #020617 65%); color: white; font-family: Arial, sans-serif; } .card { width: min(420px, 92%); padding: 30px; background: rgba(15, 23, 42, .96); border: 1px solid #334155; border-radius: 18px; box-shadow: 0 25px 80px rgba(0,0,0,.5); } .logo { text-align: center; margin-bottom: 25px; } .logo h1 { margin: 0; color: #38bdf8; font-size: 32px; } .logo p { color: #94a3b8; } .tabs { display: flex; gap: 5px; margin-bottom: 18px; } .tabs button { flex: 1; } button { cursor: pointer; border: 0; border-radius: 9px; padding: 12px; background: #0284c7; color: white; font-weight: bold; } button:hover { background: #0369a1; } .tabs button { background: #1e293b; } .tabs button.active { background: #0284c7; } input { width: 100%; margin: 7px 0; padding: 13px; background: #020617; color: white; border: 1px solid #475569; border-radius: 9px; outline: none; } input:focus { border-color: #38bdf8; } .submit { width: 100%; margin-top: 10px; } .message { margin-top: 15px; padding: 10px; border-radius: 8px; background: #1e293b; color: #cbd5e1; } .hidden { display: none; } .version { position: fixed; bottom: 10px; right: 12px; color: #64748b; font-size: 12px; } </style> </head> <body> <div class="card">
<div class="logo">

    <h1>🎮 Survive the Bots</h1>

    <p>Overleef de bots.</p>

</div>


<div class="tabs">

    <button
        id="loginTab"
        class="active"
        onclick="showLogin()">

        Inloggen

    </button>

    <button
        id="registerTab"
        onclick="showRegister()">

        Registreren

    </button>

</div>


<div id="loginForm">

    <input
        id="loginEmail"
        type="email"
        placeholder="E-mailadres"
        autocomplete="email"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Wachtwoord"
        autocomplete="current-password"
    >

    <button
        class="submit"
        onclick="login()">

        ▶ Inloggen

    </button>

</div>


<div id="registerForm" class="hidden">

    <input
        id="registerUsername"
        type="text"
        placeholder="Gebruikersnaam"
        maxlength="20"
    >

    <input
        id="registerEmail"
        type="email"
        placeholder="E-mailadres"
        autocomplete="email"
    >

    <input
        id="registerPassword"
        type="password"
        placeholder="Wachtwoord"
        autocomplete="new-password"
    >

    <button
        class="submit"
        onclick="register()">

        📝 Account maken

    </button>

</div>


<div
    id="message"
    class="message hidden">
</div>

</div> <div class="version"> v1.3.0 </div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="supabase-config.js"></script> <script> const supabaseClient = supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); function showMessage(text) { const message = document.getElementById("message"); message.textContent = text; message.classList.remove("hidden"); } function showLogin() { document .getElementById("loginForm") .classList.remove("hidden"); document .getElementById("registerForm") .classList.add("hidden"); document .getElementById("loginTab") .classList.add("active"); document .getElementById("registerTab") .classList.remove("active"); } function showRegister() { document .getElementById("loginForm") .classList.add("hidden"); document .getElementById("registerForm") .classList.remove("hidden"); document .getElementById("registerTab") .classList.add("active"); document .getElementById("loginTab") .classList.remove("active"); } async function register() { const username = document .getElementById("registerUsername") .value .trim(); const email = document .getElementById("registerEmail") .value .trim(); const password = document .getElementById("registerPassword") .value; if (!username || !email || !password) { showMessage( "Vul alle velden in." ); return; } if (username.length < 3) { showMessage( "Je gebruikersnaam moet minimaal 3 tekens hebben." ); return; } if (password.length < 6) { showMessage( "Je wachtwoord moet minimaal 6 tekens hebben." ); return; } showMessage( "Account wordt aangemaakt..." ); const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password, options: { data: { username: username } } }); if (error) { console.error(error); showMessage( error.message ); return; } if (data.session) { location.href = "game.html"; return; } showMessage( "Account aangemaakt. Controleer eventueel je e-mail en log daarna in." ); showLogin(); document .getElementById("loginEmail") .value = email; } async function login() { const email = document .getElementById("loginEmail") .value .trim(); const password = document .getElementById("loginPassword") .value; if (!email || !password) { showMessage( "Vul je e-mailadres en wachtwoord in." ); return; } showMessage( "Inloggen..." ); const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password }); if (error) { console.error(error); showMessage( error.message ); return; } if (data.session) { location.href = "game.html"; } } // ============================================================ // AL INGLOGD? // ============================================================ (async function() { const { data } = await supabaseClient.auth.getSession(); if (data.session) { location.href = "game.html"; } })(); </script> </body> </html>
