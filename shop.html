<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Weapon Shop - Survive the Bots</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #172554 0%,
            #020617 65%
        );

    color: white;

    font-family: Arial, sans-serif;
}


/* ============================================================
   HEADER
============================================================ */

header {

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 14px 18px;

    background:
        rgba(2, 6, 23, .97);

    border-bottom:
        1px solid #334155;

    box-shadow:
        0 5px 25px rgba(0,0,0,.25);
}


header h1 {

    margin: 0;

    margin-right: auto;

    color: #38bdf8;

    font-size: 21px;
}


button {

    padding: 10px 14px;

    border: 0;

    border-radius: 8px;

    background: #0284c7;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .15s,
        transform .1s;
}


button:hover {

    background: #0369a1;

    transform: translateY(-1px);
}


.logout {

    background: #dc2626;
}


.logout:hover {

    background: #b91c1c;
}


/* ============================================================
   CONTAINER
============================================================ */

.container {

    width: min(1100px, 92%);

    margin: 30px auto;

    padding-bottom: 50px;
}


/* ============================================================
   COINS
============================================================ */

.coins {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;

    padding: 17px 20px;

    background:
        rgba(15,23,42,.96);

    border:
        1px solid #334155;

    border-radius: 12px;

    font-size: 19px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}


.coins-value {

    color: #facc15;

    font-weight: bold;

    font-size: 22px;
}


/* ============================================================
   MESSAGE
============================================================ */

.message {

    display: none;

    padding: 14px 16px;

    margin-bottom: 18px;

    background:
        #1e293b;

    border:
        1px solid #334155;

    border-radius: 10px;

    color: #cbd5e1;
}


.message.show {

    display: block;
}


.message.success {

    background:
        #052e16;

    border-color:
        #166534;

    color:
        #bbf7d0;
}


.message.error {

    background:
        #451a1a;

    border-color:
        #7f1d1d;

    color:
        #fecaca;
}


/* ============================================================
   SHOP
============================================================ */

.shop {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 18px;
}


/* ============================================================
   WEAPON CARD
============================================================ */

.card {

    overflow: hidden;

    background:
        rgba(15,23,42,.96);

    border:
        1px solid #334155;

    border-radius: 16px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);

    transition:
        transform .15s,
        border-color .15s,
        box-shadow .15s;
}


.card:hover {

    transform:
        translateY(-3px);

    border-color:
        #38bdf8;

    box-shadow:
        0 20px 50px rgba(0,0,0,.4);
}


/* ============================================================
   WEAPON VISUAL
============================================================ */

.weapon-visual {

    height: 150px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle,
            #1e293b,
            #020617
        );

    border-bottom:
        1px solid #334155;
}


.weapon-image {

    width: 100%;

    height: 150px;

    object-fit: contain;
}


.weapon-icon {

    font-size: 70px;
}


/* ============================================================
   CARD CONTENT
============================================================ */

.card-content {

    padding: 18px;
}


.card h2 {

    margin:
        0 0 8px;

    color:
        #38bdf8;
}


.description {

    min-height: 44px;

    color:
        #cbd5e1;

    line-height:
        1.5;
}


/* ============================================================
   STATS
============================================================ */

.stats {

    margin-top: 15px;

    padding-top: 13px;

    border-top:
        1px solid #334155;

    color:
        #cbd5e1;

    line-height:
        1.8;
}


/* ============================================================
   PRICE
============================================================ */

.price {

    margin:
        16px 0 8px;

    color:
        #facc15;

    font-size:
        22px;

    font-weight:
        bold;
}


/* ============================================================
   BUY BUTTON
============================================================ */

.buy {

    width: 100%;

    margin-top: 5px;

    padding: 12px;
}


.buy:hover:not(:disabled) {

    background:
        #16a34a;
}


.buy:disabled {

    background:
        #475569;

    color:
        #cbd5e1;

    cursor:
        not-allowed;

    transform:
        none;
}


.buy.owned {

    background:
        #166534;
}


/* ============================================================
   LOADING
============================================================ */

.loading {

    opacity:
        .6;

    pointer-events:
        none;
}


/* ============================================================
   VERSION
============================================================ */

.version {

    position: fixed;

    right: 10px;

    bottom: 7px;

    color:
        #475569;

    font-size:
        11px;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {

    header {

        flex-wrap:
            wrap;

    }

    header h1 {

        width:
            100%;

        margin-right:
            0;

        margin-bottom:
            5px;

    }

    header button {

        font-size:
            12px;

        padding:
            8px 10px;

    }

}


@media (max-width: 450px) {

    .shop {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header>

    <h1>
        🛒 Weapon Shop
    </h1>


    <button
        type="button"
        onclick="goTo('game.html')">

        🎮 Game

    </button>


    <button
        type="button"
        onclick="goTo('inventory.html')">

        🔫 Wapens

    </button>


    <button
        type="button"
        onclick="goTo('leaderboard.html')">

        🏆 Scores

    </button>


    <button
        id="adminButton"
        class="hidden"
        type="button"
        onclick="goTo('admin.html')">

        👑 Admin

    </button>


    <button
        class="logout"
        type="button"
        onclick="logout()">

        Uitloggen

    </button>

</header>


<!-- ==========================================================
     CONTENT
========================================================== -->

<main class="container">


    <div class="coins">

        <span>
            💰 Jouw coins
        </span>

        <span
            id="coins"
            class="coins-value">

            0

        </span>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div
        id="shop"
        class="shop">

    </div>


</main>


<div class="version">
    Survive the Bots v1.3.2
</div>


<!-- ==========================================================
     SCRIPTS
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="auth.js"></script>


<script>

"use strict";


// ============================================================
// SUPABASE
// ============================================================

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ============================================================
// STATE
// ============================================================

let currentPlayer = null;

let coins = 0;

let owned = new Set();


// ============================================================
// NAVIGATION
// ============================================================

function goTo(page) {

    window.location.href =
        page;

}


// ============================================================
// INIT
// ============================================================

async function init() {

    currentPlayer =
        requireLogin();

    if (!currentPlayer) {
        return;
    }


    if (
        currentPlayer.role === "admin"
    ) {

        document
            .getElementById("adminButton")
            .classList.remove("hidden");

    }


    await loadProfile();

    await loadOwned();

    await loadShop();

}


// ============================================================
// LOAD PROFILE
// ============================================================

async function loadProfile() {

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("coins")
            .eq(
                "id",
                currentPlayer.id
            )
            .single();


    if (error) {

        console.error(
            "Profiel laden:",
            error
        );

        showMessage(
            "Je profiel kon niet geladen worden.",
            "error"
        );

        return;
    }


    coins =
        Number(
            data.coins || 0
        );


    updateCoins();

}


// ============================================================
// LOAD OWNED WEAPONS
// ============================================================

async function loadOwned() {

    const { data, error } =
        await supabaseClient
            .from("user_weapons")
            .select("weapon_id")
            .eq(
                "user_id",
                currentPlayer.id
            );


    if (error) {

        console.error(
            "Eigen wapens:",
            error
        );

        return;
    }


    owned =
        new Set(
            (data || [])
                .map(
                    weapon =>
                        weapon.weapon_id
                )
        );

}


// ============================================================
// LOAD SHOP
// ============================================================

async function loadShop() {

    const shop =
        document.getElementById(
            "shop"
        );


    shop.innerHTML =
        "<div class='message show'>Shop laden...</div>";


    const { data, error } =
        await supabaseClient
            .from("weapons")
            .select("*")
            .eq(
                "is_active",
                true
            )
            .order(
                "price",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Shop laden:",
            error
        );

        shop.innerHTML = "";

        showMessage(
            "Shop kon niet geladen worden.",
            "error"
        );

        return;
    }


    shop.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        shop.innerHTML =
            "<div class='message show'>Er zijn momenteel geen wapens beschikbaar.</div>";

        return;
    }


    data.forEach(
        weapon => {

            shop.appendChild(
                createWeaponCard(
                    weapon
                )
            );

        }
    );

}


// ============================================================
// CREATE WEAPON CARD
// ============================================================

function createWeaponCard(
    weapon
) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "card";


    const isOwned =
        owned.has(
            weapon.id
        );


    // --------------------------------------------------------
    // VISUAL
    // --------------------------------------------------------

    const visual =
        document.createElement(
            "div"
        );

    visual.className =
        "weapon-visual";


    if (weapon.image_url) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "weapon-image";

        image.src =
            weapon.image_url;

        image.alt =
            weapon.name || "Wapen";


        image.onerror =
            function () {

                visual.innerHTML = "";

                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "weapon-icon";

                icon.textContent =
                    weapon.icon || "🔫";

                visual.appendChild(
                    icon
                );

            };


        visual.appendChild(
            image
        );

    } else {

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "weapon-icon";

        icon.textContent =
            weapon.icon || "🔫";

        visual.appendChild(
            icon
        );

    }


    card.appendChild(
        visual
    );


    // --------------------------------------------------------
    // CONTENT
    // --------------------------------------------------------

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "card-content";


    const title =
        document.createElement(
            "h2"
        );

    title.textContent =
        weapon.name ||
        "Onbekend wapen";

    content.appendChild(
        title
    );


    const description =
        document.createElement(
            "div"
        );

    description.className =
        "description";

    description.textContent =
        weapon.description ||
        "Geen beschrijving beschikbaar.";

    content.appendChild(
        description
    );


    // --------------------------------------------------------
    // STATS
    // --------------------------------------------------------

    const stats =
        document.createElement(
            "div"
        );

    stats.className =
        "stats";


    stats.innerHTML = `

        <div>
            💥 Damage:
            ${escapeHtml(weapon.damage)}
        </div>

        <div>
            ⚡ Fire rate:
            ${escapeHtml(weapon.fire_rate)}
            ms
        </div>

        <div>
            🔫 Kogels:
            ${escapeHtml(weapon.bullets)}
        </div>

        <div>
            🎯 Snelheid:
            ${escapeHtml(weapon.bullet_speed)}
        </div>

    `;


    content.appendChild(
        stats
    );


    // --------------------------------------------------------
    // PRICE
    // --------------------------------------------------------

    const price =
        document.createElement(
            "div"
        );

    price.className =
        "price";

    price.textContent =
        "💰 " +
        Number(
            weapon.price || 0
        );


    content.appendChild(
        price
    );


    // --------------------------------------------------------
    // BUY BUTTON
    // --------------------------------------------------------

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "buy";


    if (isOwned) {

        button.disabled =
            true;

        button.classList.add(
            "owned"
        );

        button.textContent =
            "✓ In bezit";

    } else {

        button.textContent =
            "Kopen";

        button.addEventListener(
            "click",
            function () {

                buyWeapon(
                    weapon.id,
                    button
                );

            }
        );

    }


    content.appendChild(
        button
    );


    card.appendChild(
        content
    );


    return card;

}


// ============================================================
// BUY WEAPON
// ============================================================

async function buyWeapon(
    weaponId,
    button
) {

    if (!weaponId) {
        return;
    }


    if (
        owned.has(
            weaponId
        )
    ) {

        showMessage(
            "Je bezit dit wapen al."
        );

        return;
    }


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Kopen...";

        button.classList.add(
            "loading"
        );

    }


    showMessage(
        "Aankoop wordt verwerkt..."
    );


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "buy_weapon",
                {
                    p_weapon_id:
                        weaponId
                }
            );


        if (error) {

            console.error(
                "Wapen kopen:",
                error
            );

            showMessage(
                error.message ||
                "Het wapen kon niet gekocht worden.",
                "error"
            );

            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "Kopen";

            }

            return;
        }


        /*
            De RPC kan verschillende
            soorten resultaten teruggeven.
            Daarom proberen we coins uit
            het resultaat te lezen wanneer
            die aanwezig zijn.
        */

        let result =
            data;


        if (
            typeof result === "string"
        ) {

            try {

                result =
                    JSON.parse(
                        result
                    );

            } catch (_) {

                // Geen JSON,
                // resultaat gewoon negeren.

            }

        }


        if (
            result &&
            typeof result === "object"
        ) {

            if (
                result.coins !== undefined
            ) {

                coins =
                    Number(
                        result.coins
                    );

            }

            if (
                result.new_coins !== undefined
            ) {

                coins =
                    Number(
                        result.new_coins
                    );

            }

        }


        showMessage(
            "✅ Wapen gekocht!",
            "success"
        );


        await loadProfile();

        await loadOwned();

        await loadShop();


    } catch (error) {

        console.error(
            "Aankoop:",
            error
        );

        showMessage(
            "Er ging iets mis bij de aankoop.",
            "error"
        );

        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Kopen";

        }

    }

}


// ============================================================
// UPDATE COINS
// ============================================================

function updateCoins() {

    document
        .getElementById("coins")
        .textContent =
        coins;

}


// ============================================================
// MESSAGE
// ============================================================

function showMessage(
    text,
    type = ""
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message show";


    if (type) {

        message.classList.add(
            type
        );

    }

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ============================================================
// START
// ============================================================

init();

</script>

</body>

</html>
