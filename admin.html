<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive the Bots - Admin</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background:
            radial-gradient(circle at top, #172554, #020617 70%);
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        width: min(1100px, 94%);
        margin: auto;
        padding: 30px 0;
    }

    .card {
        background: rgba(15,23,42,.96);
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 20px;
    }

    h1 {
        color: #38bdf8;
    }

    input,
    select {
        padding: 11px;
        background: #020617;
        color: white;
        border: 1px solid #475569;
        border-radius: 8px;
        margin: 4px;
    }

    button {
        padding: 10px 15px;
        border: 0;
        border-radius: 8px;
        background: #0284c7;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin: 3px;
    }

    button:hover {
        background: #0369a1;
    }

    .danger {
        background: #dc2626;
    }

    .danger:hover {
        background: #b91c1c;
    }

    .success {
        background: #16a34a;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px 8px;
        border-bottom: 1px solid #334155;
        text-align: left;
    }

    th {
        color: #38bdf8;
    }

    .message {
        padding: 12px;
        background: #1e293b;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    @media(max-width:700px) {

        table {
            font-size: 13px;
        }

        .desktop-only {
            display: none;
        }

    }
</style>

</head> <body> <div class="container">
<div class="card">

    <h1>👑 Adminpaneel</h1>

    <button onclick="location.href='index.html'">
        ← Menu
    </button>

    <button onclick="location.href='game.html'">
        🎮 Game
    </button>

</div>


<div
    id="message"
    class="message"
    style="display:none"
></div>


<!-- NIEUWE USER -->

<div class="card">

    <h2>➕ Nieuwe gebruiker</h2>

    <input
        id="newUsername"
        placeholder="Gebruikersnaam"
    >

    <input
        id="newPassword"
        type="text"
        placeholder="Wachtwoord"
    >

    <select id="newRole">

        <option value="player">
            Player
        </option>

        <option value="admin">
            Admin
        </option>

    </select>

    <input
        id="newCoins"
        type="number"
        value="0"
        min="0"
        placeholder="Coins"
    >

    <button
        class="success"
        onclick="createPlayer()"
    >
        Gebruiker aanmaken
    </button>

</div>


<!-- USERS -->

<div class="card">

    <h2>👥 Gebruikers</h2>

    <button onclick="loadPlayers()">
        🔄 Vernieuwen
    </button>

    <div style="overflow-x:auto">

        <table>

            <thead>

                <tr>
                    <th>Username</th>
                    <th>Rol</th>
                    <th>Coins</th>
                    <th>Acties</th>
                </tr>

            </thead>

            <tbody id="playersBody">

                <tr>
                    <td colspan="4">
                        Laden...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div> <script src="supabase-config.js"></script> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script> const supabaseClient = supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); let currentPlayer = null; function message(text) { const box = document.getElementById("message"); box.textContent = text; box.style.display = "block"; } function isAdmin() { return ( currentPlayer && currentPlayer.role === "admin" ); } async function createPlayer() { if (!isAdmin()) { message("Geen adminrechten."); return; } const username = document .getElementById("newUsername") .value .trim(); const password = document .getElementById("newPassword") .value; const role = document .getElementById("newRole") .value; const coins = Number( document .getElementById("newCoins") .value ); const { error } = await supabaseClient.rpc( "admin_create_player", { p_username: username, p_password: password, p_role: role, p_coins: coins } ); if (error) { console.error(error); message(error.message); return; } message( "Gebruiker succesvol aangemaakt." ); document.getElementById( "newUsername" ).value = ""; document.getElementById( "newPassword" ).value = ""; document.getElementById( "newCoins" ).value = "0"; loadPlayers(); } async function loadPlayers() { if (!isAdmin()) { message("Geen adminrechten."); return; } const { data, error } = await supabaseClient.rpc( "admin_get_players" ); if (error) { console.error(error); message(error.message); return; } const body = document.getElementById( "playersBody" ); body.innerHTML = ""; (data || []).forEach(player => { const row = document.createElement("tr"); row.innerHTML = ` <td> ${escapeHtml(player.username)} </td> <td> <select id="role-${player.id}"> <option value="player" ${player.role === "player" ? "selected" : ""} > Player </option> <option value="admin" ${player.role === "admin" ? "selected" : ""} > Admin </option> </select> </td> <td> <input id="coins-${player.id}" type="number" value="${player.coins}" min="0" style="width:100px" > </td> <td> <button onclick="savePlayer('${player.id}')" > 💾 Opslaan </button> <button onclick="changePassword('${player.id}')" > 🔑 Wachtwoord </button> <button class="danger" onclick="deletePlayer('${player.id}')" > 🗑 Verwijderen </button> </td> `; body.appendChild(row); }); } async function savePlayer(id) { const role = document.getElementById( `role-${id}` ).value; const coins = Number( document.getElementById( `coins-${id}` ).value ); const { error } = await supabaseClient.rpc( "admin_update_player", { p_id: id, p_role: role, p_coins: coins } ); if (error) { message(error.message); return; } message( "Gebruiker bijgewerkt." ); loadPlayers(); } async function changePassword(id) { const password = prompt( "Nieuw wachtwoord:" ); if (!password) return; const { error } = await supabaseClient.rpc( "admin_change_password", { p_id: id, p_password: password } ); if (error) { message(error.message); return; } message( "Wachtwoord gewijzigd." ); } async function deletePlayer(id) { if ( !confirm( "Deze gebruiker definitief verwijderen?" ) ) { return; } const { error } = await supabaseClient.rpc( "admin_delete_player", { p_id: id } ); if (error) { message(error.message); return; } message( "Gebruiker verwijderd." ); loadPlayers(); } function escapeHtml(value) { return String(value ?? "") .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll('"', "&quot;") .replaceAll("'", "&#039;"); } try { const saved = localStorage.getItem("stb_player"); if (!saved) { location.href = "index.html"; } else { currentPlayer = JSON.parse(saved); if (!isAdmin()) { alert( "Je hebt geen adminrechten." ); location.href = "index.html"; } else { loadPlayers(); } } } catch (error) { console.error(error); location.href = "index.html"; } </script> </body> </html>
