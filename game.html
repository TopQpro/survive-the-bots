<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive the Bots - Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background:
            radial-gradient(circle at top, #172554, #020617 70%);
        color: white;
        font-family: Arial, sans-serif;
    }

    .version {
        position: fixed;
        top: 12px;
        right: 15px;
        color: #94a3b8;
        font-size: 13px;
        z-index: 20;
    }

    .container {
        width: min(1100px, 94%);
        margin: auto;
        padding: 25px 0;
    }

    .card {
        background: rgba(15, 23, 42, .96);
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    h1 {
        color: #38bdf8;
        margin-top: 0;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }

    .hud {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-bottom: 15px;
    }

    .hud-item {
        background: #020617;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 12px;
        text-align: center;
    }

    .hud-value {
        display: block;
        margin-top: 4px;
        font-size: 20px;
        font-weight: bold;
    }

    button {
        border: 0;
        border-radius: 9px;
        padding: 11px 17px;
        background: #0284c7;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0369a1;
    }

    .green {
        background: #16a34a;
    }

    .green:hover {
        background: #15803d;
    }

    .red {
        background: #dc2626;
    }

    .red:hover {
        background: #b91c1c;
    }

    #game {
        position: relative;
        width: 100%;
        height: 560px;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;

        background:
            linear-gradient(#111827 1px, transparent 1px),
            linear-gradient(90deg, #111827 1px, transparent 1px),
            #030712;

        background-size: 40px 40px;

        border: 2px solid #334155;
        border-radius: 15px;
    }

    #player {
        position: absolute;
        width: 30px;
        height: 30px;
        background: #22c55e;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 25px #22c55e;
        z-index: 5;
    }

    .bot {
        position: absolute;
        width: 28px;
        height: 28px;
        background: #ef4444;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 18px #ef4444;
        z-index: 4;
    }

    .bullet {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #facc15;
        border-radius: 50%;
        box-shadow: 0 0 10px #facc15;
        pointer-events: none;
        z-index: 10;
    }

    .instructions {
        color: #cbd5e1;
        margin-bottom: 15px;
    }

    .game-message {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: rgba(2, 6, 23, .9);
        border: 1px solid #475569;
        padding: 25px;
        border-radius: 15px;
        z-index: 15;
    }

    @media(max-width:700px) {

        .hud {
            grid-template-columns: repeat(2, 1fr);
        }

        #game {
            height: 450px;
        }
    }
</style>

</head> <body> <div class="version"> Survive the Bots v1.3.0 </div> <div class="container">
<div class="card topbar">

    <div>
        <h1>🎮 Survive the Bots</h1>
        <div>
            👤 <span id="username">-</span>
        </div>
    </div>

    <div>

        <button onclick="location.href='index.html'">
            ← Menu
        </button>

        <button onclick="location.href='shop.html'">
            🛒 Shop
        </button>

        <button onclick="location.href='leaderboard.html'">
            🏆 Leaderboard
        </button>

    </div>

</div>


<div class="card">

    <div class="hud">

        <div class="hud-item">
            ❤️ Gezondheid
            <span
                class="hud-value"
                id="health"
            >
                100
            </span>
        </div>

        <div class="hud-item">
            💀 Kills
            <span
                class="hud-value"
                id="kills"
            >
                0
            </span>
        </div>

        <div class="hud-item">
            🌊 Wave
            <span
                class="hud-value"
                id="wave"
            >
                1
            </span>
        </div>

        <div class="hud-item">
            ⭐ Score
            <span
                class="hud-value"
                id="score"
            >
                0
            </span>
        </div>

        <div class="hud-item">
            🔫 Wapen
            <span
                class="hud-value"
                id="weapon"
            >
                Pistol
            </span>
        </div>

    </div>


    <p class="instructions">
        <b>WASD</b> of de pijltjestoetsen = bewegen.
        <b>Muisklik</b> = schieten.
    </p>


    <button
        id="startButton"
        class="green"
        onclick="startGame()"
    >
        ▶ Start game
    </button>


    <div id="game">

        <div id="player"></div>

        <div
            id="gameMessage"
            class="game-message"
        >
            <h2>Survive the Bots</h2>
            <p>Klik op Start game.</p>
        </div>

    </div>

</div>

</div> <script src="supabase-config.js"></script> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script> // ============================================================ // SUPABASE // ============================================================ const supabaseClient = supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); // ============================================================ // PLAYER // ============================================================ let currentPlayer = null; try { const saved = localStorage.getItem("stb_player"); if (!saved) { window.location.href = "index.html"; } else { currentPlayer = JSON.parse(saved); document .getElementById("username") .textContent = currentPlayer.username; } } catch (error) { console.error(error); localStorage.removeItem( "stb_player" ); window.location.href = "index.html"; } // ============================================================ // GAME STATE // ============================================================ let gameRunning = false; let health = 100; let kills = 0; let wave = 1; let score = 0; let bots = []; let bullets = []; let keys = {}; let animationFrame = null; let lastDamageTime = 0; // ============================================================ // ELEMENTS // ============================================================ const game = document.getElementById("game"); const player = document.getElementById("player"); // ============================================================ // KEYBOARD // ============================================================ document.addEventListener( "keydown", function(event) { keys[ event.key.toLowerCase() ] = true; } ); document.addEventListener( "keyup", function(event) { keys[ event.key.toLowerCase() ] = false; } ); // ============================================================ // START GAME // ============================================================ function startGame() { console.log( "Survive the Bots v1.3.0 gestart." ); gameRunning = true; health = 100; kills = 0; wave = 1; score = 0; keys = {}; clearGame(); player.style.left = "50%"; player.style.top = "50%"; document .getElementById("startButton") .textContent = "↻ Opnieuw starten"; document .getElementById("gameMessage") .classList.add("hidden"); updateHud(); spawnBots(); if (animationFrame) { cancelAnimationFrame( animationFrame ); } animationFrame = requestAnimationFrame( gameLoop ); } // ============================================================ // CLEAR GAME // ============================================================ function clearGame() { bots.forEach( bot => { if (bot.element) { bot.element.remove(); } } ); bots = []; bullets.forEach( bullet => { if (bullet.element) { bullet.element.remove(); } } ); bullets = []; } // ============================================================ // GAME LOOP // ============================================================ function gameLoop() { if (!gameRunning) { return; } movePlayer(); moveBots(); checkBotCollisions(); updateBullets(); animationFrame = requestAnimationFrame( gameLoop ); } // ============================================================ // PLAYER MOVEMENT // ============================================================ function movePlayer() { const speed = 0.7; let x = parseFloat( player.style.left || "50" ); let y = parseFloat( player.style.top || "50" ); if ( keys["w"] || keys["arrowup"] ) { y -= speed; } if ( keys["s"] || keys["arrowdown"] ) { y += speed; } if ( keys["a"] || keys["arrowleft"] ) { x -= speed; } if ( keys["d"] || keys["arrowright"] ) { x += speed; } x = Math.max( 2, Math.min(98, x) ); y = Math.max( 3, Math.min(97, y) ); player.style.left = x + "%"; player.style.top = y + "%"; } // ============================================================ // SPAWN BOTS // ============================================================ function spawnBots() { const amount = 4 + wave; for ( let i = 0; i < amount; i++ ) { const element = document.createElement("div"); element.className = "bot"; let x; let y; const side = Math.floor( Math.random() * 4 ); if (side === 0) { x = 2; y = Math.random() * 95; } else if (side === 1) { x = 98; y = Math.random() * 95; } else if (side === 2) { x = Math.random() * 95; y = 2; } else { x = Math.random() * 95; y = 98; } element.style.left = x + "%"; element.style.top = y + "%"; game.appendChild( element ); bots.push({ element: element, x: x, y: y, speed: 0.06 + Math.random() * 0.04 }); } } // ============================================================ // MOVE BOTS // ============================================================ function moveBots() { const px = parseFloat( player.style.left ); const py = parseFloat( player.style.top ); bots.forEach( bot => { const dx = px - bot.x; const dy = py - bot.y; const distance = Math.sqrt( dx * dx + dy * dy ); if (distance > 0.5) { bot.x += dx / distance * bot.speed; bot.y += dy / distance * bot.speed; } bot.element.style.left = bot.x + "%"; bot.element.style.top = bot.y + "%"; } ); } // ============================================================ // BOT COLLISION // ============================================================ function checkBotCollisions() { const now = Date.now(); if ( now - lastDamageTime < 500 ) { return; } const px = parseFloat( player.style.left ); const py = parseFloat( player.style.top ); for ( const bot of bots ) { const dx = px - bot.x; const dy = py - bot.y; const distance = Math.sqrt( dx * dx + dy * dy ); if (distance < 3.5) { health -= 10; lastDamageTime = now; updateHud(); if (health <= 0) { gameOver(); } break; } } } // ============================================================ // SHOOT // ============================================================ game.addEventListener( "click", shoot ); function shoot(event) { if (!gameRunning) { return; } const rect = game.getBoundingClientRect(); const targetX = event.clientX - rect.left; const targetY = event.clientY - rect.top; const startX = player.offsetLeft; const startY = player.offsetTop; const dx = targetX - startX; const dy = targetY - startY; const distance = Math.sqrt( dx * dx + dy * dy ); if (distance === 0) { return; } const speed = 9; const bullet = document.createElement("div"); bullet.className = "bullet"; bullet.style.left = startX + "px"; bullet.style.top = startY + "px"; game.appendChild( bullet ); bullets.push({ element: bullet, x: startX, y: startY, vx: dx / distance * speed, vy: dy / distance * speed }); } // ============================================================ // BULLETS // ============================================================ function updateBullets() { const width = game.clientWidth; const height = game.clientHeight; bullets = bullets.filter( bullet => { bullet.x += bullet.vx; bullet.y += bullet.vy; bullet.element.style.left = bullet.x + "px"; bullet.element.style.top = bullet.y + "px"; if ( bullet.x < 0 || bullet.x > width || bullet.y < 0 || bullet.y > height ) { bullet.element.remove(); return false; } for ( let i = 0; i < bots.length; i++ ) { const bot = bots[i]; const bx = bot.x / 100 * width; const by = bot.y / 100 * height; const dx = bullet.x - bx; const dy = bullet.y - by; const distance = Math.sqrt( dx * dx + dy * dy ); if ( distance < 25 ) { bot.element.remove(); bots.splice( i, 1 ); bullet.element.remove(); kills++; score += 10; updateHud(); if ( bots.length === 0 && gameRunning ) { nextWave(); } return false; } } return true; } ); } // ============================================================ // NEXT WAVE // ============================================================ function nextWave() { wave++; score += wave * 25; updateHud(); spawnBots(); } // ============================================================ // GAME OVER // ============================================================ function gameOver() { if (!gameRunning) { return; } gameRunning = false; if (animationFrame) { cancelAnimationFrame( animationFrame ); } document .getElementById("gameMessage") .classList.remove("hidden"); document .getElementById("gameMessage") .innerHTML = ` <h2>💀 Game Over</h2> <p> Score: <b>${score}</b> </p> <p> Kills: <b>${kills}</b> </p> <p> Wave: <b>${wave}</b> </p> <button class="green" onclick="startGame()" > ▶ Opnieuw </button> `; saveScore(); } // ============================================================ // HUD // ============================================================ function updateHud() { document .getElementById("health") .textContent = Math.max( 0, Math.round(health) ); document .getElementById("kills") .textContent = kills; document .getElementById("wave") .textContent = wave; document .getElementById("score") .textContent = score; } // ============================================================ // SAVE SCORE // ============================================================ async function saveScore() { if (!currentPlayer) { return; } try { const { error } = await supabaseClient .from("leaderboard") .insert({ user_id: currentPlayer.id, player_name: currentPlayer.username, score: score, kills: kills, wave: wave }); if (error) { console.error( "Score opslaan mislukt:", error ); } } catch (error) { console.error( "Score error:", error ); } } </script> </body> </html>
