<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Survive the Bots</title>

<style>

/* ============================================================
   ROBOTS
   ============================================================ */

.bot {
    position: absolute;

    width: 34px;
    height: 40px;

    background: linear-gradient(
        145deg,
        #64748b,
        #1e293b
    );

    border: 2px solid #94a3b8;

    border-radius: 7px;

    box-shadow:
        0 0 8px rgba(56,189,248,.35);

    transform:
        translate(-50%, -50%);

    z-index: 10;
}


/* Hoofd */

.bot::before {

    content: "";

    position: absolute;

    width: 24px;
    height: 20px;

    left: 3px;
    top: 4px;

    background: #334155;

    border: 2px solid #94a3b8;

    border-radius: 5px;
}


/* Ogen */

.bot::after {

    content: "•  •";

    position: absolute;

    left: 5px;
    top: 5px;

    width: 20px;

    color: #38bdf8;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 5px #38bdf8;
}


/* Lichaam */

.bot {
    box-shadow:
        inset 0 -10px 0 rgba(2,6,23,.45),
        0 0 8px rgba(56,189,248,.35);
}


/* ============================================================
   FAST ROBOT
   ============================================================ */

.bot.fast {

    width: 28px;
    height: 34px;

    background:
        linear-gradient(
            145deg,
            #f97316,
            #7c2d12
        );

    border-color: #fb923c;

    box-shadow:
        0 0 12px rgba(249,115,22,.65);
}


.bot.fast::before {

    background: #9a3412;

    border-color: #fdba74;
}


.bot.fast::after {

    color: #fde047;

    text-shadow:
        0 0 6px #fde047;
}


/* ============================================================
   TANK ROBOT
   ============================================================ */

.bot.tank {

    width: 50px;
    height: 52px;

    background:
        linear-gradient(
            145deg,
            #475569,
            #020617
        );

    border: 3px solid #64748b;

    border-radius: 9px;

    box-shadow:
        0 0 15px rgba(239,68,68,.45),
        inset 0 0 12px rgba(0,0,0,.8);
}


.bot.tank::before {

    width: 34px;
    height: 25px;

    left: 5px;
    top: 5px;

    background: #1e293b;

    border:
        3px solid #64748b;

    border-radius: 6px;
}


.bot.tank::after {

    content: "●  ●";

    left: 9px;
    top: 8px;

    color: #ef4444;

    font-size: 12px;

    text-shadow:
        0 0 7px #ef4444;
}


/* ============================================================
   HEALTH BAR
   ============================================================ */

.bot-health {

    position: absolute;

    width: 42px;
    height: 5px;

    left: 50%;

    top: -13px;

    transform:
        translateX(-50%);

    background: #020617;

    border:
        1px solid #475569;

    border-radius: 4px;

    overflow: hidden;

    pointer-events: none;

    z-index: 20;
}


.bot-health-inner {

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #22c55e,
            #84cc16
        );

    transition:
        width .12s linear,
        background .15s linear;
}


/* Lage HP */

.bot-health-inner.medium {

    background:
        linear-gradient(
            90deg,
            #eab308,
            #f59e0b
        );
}


.bot-health-inner.low {

    background:
        linear-gradient(
            90deg,
            #ef4444,
            #dc2626
        );
}

.bot.hit {
    filter:
        brightness(2)
        drop-shadow(
            0 0 8px white
        );
}


* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020617;

    color: white;

    font-family: Arial, sans-serif;
}


/* ============================================================
   TOPBAR
============================================================ */

#topbar {

    position: fixed;

    z-index: 1000;

    top: 0;
    left: 0;
    right: 0;

    min-height: 60px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 12px;

    background:
        rgba(2,6,23,.96);

    border-bottom:
        1px solid #334155;
}


.logo {

    color: #38bdf8;

    font-size: 18px;

    font-weight: bold;

    margin-right: auto;
}


.hud {

    display: flex;

    gap: 6px;

    flex-wrap: wrap;
}


.hud-item {

    background: #0f172a;

    border:
        1px solid #334155;

    border-radius: 7px;

    padding: 7px 9px;

    font-size: 13px;
}


button {

    cursor: pointer;

    border: 0;

    border-radius: 8px;

    padding: 9px 12px;

    background: #0284c7;

    color: white;

    font-weight: bold;
}


button:hover {

    background: #0369a1;
}


.logout {

    background: #dc2626;
}


.logout:hover {

    background: #b91c1c;
}


/* ============================================================
   GAME
============================================================ */

#game {

    position: absolute;

    top: 60px;
    bottom: 0;
    left: 0;
    right: 0;

    overflow: hidden;

    background:

        linear-gradient(
            rgba(30,41,59,.5) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(30,41,59,.5) 1px,
            transparent 1px
        ),

        #030712;

    background-size: 40px 40px;
}


/* ============================================================
   PLAYER
============================================================ */

#player {

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow:
        0 0 10px #22c55e,
        0 0 25px
        rgba(34,197,94,.7);

    transform:
        translate(-50%,-50%);

    z-index: 20;
}



}


/* ============================================================
   BULLET
============================================================ */

.bullet {

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #facc15;

    box-shadow:
        0 0 9px #facc15;

    transform:
        translate(-50%,-50%);
}


/* ============================================================
   OVERLAY
============================================================ */

.overlay {

    position: fixed;

    z-index: 500;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(2,6,23,.75);
}


.overlay-box {

    width: min(430px,90%);

    padding: 30px;

    text-align: center;

    background:
        rgba(15,23,42,.98);

    border:
        1px solid #334155;

    border-radius: 18px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.6);
}


.overlay-box h1 {

    color: #38bdf8;
}


.hidden {

    display: none !important;
}


.version {

    position: fixed;

    z-index: 2000;

    right: 10px;

    bottom: 7px;

    color: #64748b;

    font-size: 11px;
}


#crosshair {

    position: fixed;

    z-index: 3000;

    width: 18px;
    height: 18px;

    border:
        2px solid
        rgba(255,255,255,.8);

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    display: none;
}


#damageFlash {

    position: fixed;

    z-index: 200;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    background:
        rgba(239,68,68,.3);

    pointer-events: none;

    display: none;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 850px) {

    #topbar {

        min-height: auto;

        flex-wrap: wrap;
    }

    .logo {

        width: 100%;

        margin-right: 0;
    }

    .hud {

        width: 100%;
    }

    #topbar > button {

        font-size: 11px;

        padding: 7px;
    }

}

</style>

</head>

<body>


<!-- ==========================================================
     TOPBAR
========================================================== -->

<div id="topbar">

    <div class="logo">
        🎮 Survive the Bots
    </div>


    <div class="hud">

        <div class="hud-item">
            👤 <span id="username">-</span>
        </div>

        <div class="hud-item">
            ❤️ <span id="health">100</span>
        </div>

        <div class="hud-item">
            💀 <span id="kills">0</span>
        </div>

        <div class="hud-item">
            🌊 <span id="wave">1</span>
        </div>

        <div class="hud-item">
            ⭐ <span id="score">0</span>
        </div>

        <div class="hud-item">
            💰 <span id="coins">0</span>
        </div>

    </div>


    <button onclick="location.href='shop.html'">
        🛒 Shop
    </button>


    <button onclick="location.href='inventory.html'">
        🔫 Wapens
    </button>


    <button onclick="location.href='leaderboard.html'">
        🏆 Scores
    </button>


    <button
        id="adminButton"
        class="hidden"
        onclick="location.href='admin.html'">

        👑 Admin

    </button>


    <button
        class="logout"
        onclick="logout()">

        Uitloggen

    </button>

</div>


<!-- ==========================================================
     GAME
========================================================== -->

<div id="game">

    <div id="player"></div>

</div>


<div id="crosshair"></div>

<div id="damageFlash"></div>


<!-- ==========================================================
     START
========================================================== -->

<div
    id="startOverlay"
    class="overlay">

    <div class="overlay-box">

        <h1>
            🎮 Survive the Bots
        </h1>

        <p>
            Overleef zoveel mogelijk waves.
        </p>

        <p>
            <b>WASD</b> of pijltjestoetsen<br>
            Muis om te richten en te schieten
        </p>

        <button
            onclick="startGame()">

            ▶ Start Game

        </button>

    </div>

</div>


<!-- ==========================================================
     GAME OVER
========================================================== -->

<div
    id="gameOverOverlay"
    class="overlay hidden">

    <div class="overlay-box">

        <h1>
            💀 Game Over
        </h1>

        <p>
            Score:
            <b id="finalScore">0</b>
        </p>

        <p>
            Kills:
            <b id="finalKills">0</b>
        </p>

        <p>
            Wave:
            <b id="finalWave">1</b>
        </p>

        <button
            onclick="startGame()">

            🔄 Opnieuw

        </button>

        <button
            onclick="location.href='leaderboard.html'">

            🏆 Leaderboard

        </button>

    </div>

</div>


<div class="version">
    v1.3.1
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="auth.js"></script>

<script src="game.js"></script>

</body>

</html>
